      0% { transform: scale(1); }

      100% { transform: scale(1); }
    }
    .animate-cart-pop { animation: cartPop 0.3s ease-in-out; }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }

    @keyframes slideTransition {
      from { opacity: 0; transform: scale(0.97) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

      animation: slideTransition 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        }, (error) => {
          console.error("Firestore error:", error);
        });

        return () => unsubscribe();
      }, []);

        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * TECH_NEWS_POOL.length);
        } while (TECH_NEWS_POOL[randomIndex].id === currentNews.id && TECH_NEWS_POOL.length > 1);
        
        setCurrentNews(TECH_NEWS_POOL[randomIndex]);
        setAnimKey(Date.now());
      };

      useEffect(() => {
        const timer = setInterval(() => {
          getRandomNews();
        }, 5000);
        return () => clearInterval(timer);
      }, [currentNews]);

        if (theme === "light") setTheme("dark");
        else if (theme === "dark") setTheme("mono");
        else setTheme("light");

        e.preventDefault();
        if (usernameInput.trim()) {
          setUser(usernameInput.trim());
          setIsLoginOpen(false);
          setUsernameInput("");
        }
      };

      const handleLogout = () => setUser(null);

        if (store.outOfStock) return;
        const newRecord = {
          id: Date.now(),
          date: new Date().toLocaleString(),
          store: store.name,
          items: [{ name: product.name, price: store.price }],
          total: store.price
        };
        setOrderHistory(prev => [newRecord, ...prev]);
        window.open(store.url, "_blank", "noopener,noreferrer");
      };

      const openProductDetails = (product) => {
        setSelectedProduct(product);
        setRecentlyViewed(prev => {
          const filtered = prev.filter(p => p.id !== product.id);
          return [product, ...filtered];
        });
      };

      const addToCart = (product, store) => {
        if (store.outOfStock) return;
        setCart([...cart, { ...product, selectedStore: store, cartItemId: Date.now() + Math.random() }]);
        setCartAnimate(true);
        setTimeout(() => setCartAnimate(false), 300);
      };

      const removeFromCart = (cartItemId) => {
        setCart(cart.filter(item => item.cartItemId !== cartItemId));
      };

      // ☁️ บันทึกข้อมูลไปยัง Firestore Cloud
      const handleSaveProduct = async (updatedProduct) => {
        try {
          const docId = String(updatedProduct.id);
          await setDoc(doc(db, "products", docId), updatedProduct);
          setEditingProduct(null);
        } catch (error) {
          console.error("Error saving product to cloud: ", error);
          alert("ไม่สามารถบันทึกข้อมูลลง Cloud ได้");
        }
      };

      // ☁️ ลบข้อมูลออกจาก Firestore Cloud
      const handleDeleteProduct = async (id) => {
        if (confirm("ต้องการลบสินค้านี้จาก Cloud ใช่หรือไม่?")) {
          try {
            await deleteDoc(doc(db, "products", String(id)));
            setEditingProduct(null);
          } catch (error) {
            console.error("Error deleting product: ", error);
            alert("ไม่สามารถลบข้อมูลจาก Cloud ได้");
          }
        }
      };

        const newProd = {
          id: Date.now(),
          name: "สินค้าใหม่ Cloud",
          type: "CPU",
          spec: "ระบุสเปกสินค้า...",
          img: "https://via.placeholder.com/300",
          desc: "คำอธิบายสินค้า...",
          stores: [
            { name: "JIB", price: 1000, url: "https://www.jib.co.th", outOfStock: false },
            { name: "Advice", price: 1000, url: "https://www.advice.co.th", outOfStock: false },
            { name: "Shopee", price: 1000, url: "https://shopee.co.th", outOfStock: false }
          ]
        };
        setEditingProduct(newProd);
      };

      const filteredProducts = filter === "ALL" ? products : products.filter(p => p.type === filter);

      const getThemeClass = () => {
        if (theme === "dark") return "bg-gray-900 text-white min-h-screen p-4 sm:p-6 transition-colors duration-300";
        if (theme === "mono") return "bg-black text-gray-200 grayscale min-h-screen p-4 sm:p-6 transition-colors duration-300";
        return "bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-6 transition-colors duration-300";

        ? "bg-white text-gray-900 border-gray-200" 
        : "bg-gray-800 text-white border-gray-700";

      const getMinPrice = (stores) => {
        if (!stores) return null;
        const availableStores = stores.filter(s => !s.outOfStock);
        if (availableStores.length === 0) return null;
        
        const validPrices = availableStores.map(s => typeof s.price === 'number' ? s.price : Infinity);
        const min = Math.min(...validPrices);
        return min === Infinity ? availableStores[0].price : min;
