<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN RAM & SSD Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-950 text-white selection:bg-blue-500 selection:text-white min-h-screen font-sans">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    // ข้อมูลสินค้าเดิม
    const PRODUCTS = [
      { id: 1, category: "RAM", name: "Kingston FURY Beast DDR4 16GB (8GBx2) 3200MHz", price: 1590, img: "https://images.unsplash.com/photo-1562976540-1502c2145186?w=400&auto=format&fit=crop&q=60" },
      { id: 2, category: "RAM", name: "Corsair Vengeance RGB DDR5 32GB (16GBx2) 5600MHz", price: 4390, img: "https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=400&auto=format&fit=crop&q=60" },
      { id: 3, category: "SSD", name: "Samsung 980 PRO M.2 NVMe PCIe 4.0 1TB", price: 3490, img: "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=400&auto=format&fit=crop&q=60" },
      { id: 4, category: "SSD", name: "WD_BLACK SN850X M.2 NVMe PCIe 4.0 2TB", price: 6290, img: "https://images.unsplash.com/photo-1544652478-6653e09f18a2?w=400&auto=format&fit=crop&q=60" }
    ];

    const TEXTS = {
      TH: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "เข้าสู่ระบบ",
        register: "สมัครสมาชิก",
        logout: "ออกจากระบบ",
        email: "อีเมล",
        password: "รหัสผ่าน",
        confirmPassword: "ยืนยันรหัสผ่าน",
        verifyNotice: "กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชีก่อนใช้งาน",
        resendEmail: "ส่งอีเมลยืนยันอีกครั้ง",
        emailVerified: "ยืนยันอีเมลแล้ว",
        emailNotVerified: "ยังไม่ได้ยืนยันอีเมล",
        loginError: "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
        registerSuccess: "สมัครสมาชิกสำเร็จ! โปรดตรวจสอบอีเมลยืนยัน",
        passwordMismatch: "รหัสผ่านไม่ตรงกัน",
        passwordTooShort: "รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร",
        emailInUse: "อีเมลนี้ถูกใช้งานในระบบแล้ว",
        addToCart: "เพิ่มลงตะกร้า",
        cart: "ตะกร้าสินค้า",
        history: "ประวัติการสั่งซื้อ",
        total: "ยอดรวมทั้งหมด",
        checkout: "ชำระเงิน",
        emptyCart: "ยังไม่มีสินค้าในตะกร้า",
        needLogin: "กรุณาเข้าสู่ระบบก่อนทำการสั่งซื้อ"
      },
      EN: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "Login",
        register: "Register",
        logout: "Logout",
        email: "Email",
        password: "Password",
        confirmPassword: "Confirm Password",
        verifyNotice: "Please check your email to verify your account.",
        resendEmail: "Resend Verification Email",
        emailVerified: "Email Verified",
        emailNotVerified: "Email Not Verified",
        loginError: "Invalid email or password",
        registerSuccess: "Registration successful! Verification email sent.",
        passwordMismatch: "Passwords do not match",
        passwordTooShort: "Password must be at least 6 characters",
        emailInUse: "Email is already registered",
        addToCart: "Add to Cart",
        cart: "Cart",
        history: "Order History",
        total: "Total",
        checkout: "Checkout",
        emptyCart: "Cart is empty",
        needLogin: "Please login before placing an order"
      }
    };

    const getUsers = () => JSON.parse(localStorage.getItem("app_users") || "[]");
    const saveUsers = (users) => localStorage.setItem("app_users", JSON.stringify(users));
    const getCurrentUser = () => JSON.parse(localStorage.getItem("app_current_user") || "null");
    const setCurrentUser = (user) => localStorage.setItem("app_current_user", JSON.stringify(user));

    function App() {
      const [lang, setLang] = useState("TH");
      const [user, setUser] = useState(getCurrentUser());
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);

      // Auth Form States
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [errorMessage, setErrorMessage] = useState("");
      const [successMessage, setSuccessMessage] = useState("");
      const [loading, setLoading] = useState(false);

      const t = TEXTS[lang];

      const handleLogin = (e) => {
        e.preventDefault();
        setErrorMessage("");
        setLoading(true);

        setTimeout(() => {
          const users = getUsers();
          const foundUser = users.find(u => u.email.toLowerCase() === email.toLowerCase());

          if (!foundUser || foundUser.password !== password) {
            setErrorMessage(t.loginError);
            setLoading(false);
            return;
          }

          setCurrentUser(foundUser);
          setUser(foundUser);
          setIsAuthOpen(false);
          resetForm();
          setLoading(false);
        }, 300);
      };

      const handleRegister = (e) => {
        e.preventDefault();
        setErrorMessage("");

        if (password !== confirmPassword) {
          setErrorMessage(t.passwordMismatch);
          return;
        }

        if (password.length < 6) {
          setErrorMessage(t.passwordTooShort);
          return;
        }

        setLoading(true);

        setTimeout(() => {
          const users = getUsers();
          if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
            setErrorMessage(t.emailInUse);
            setLoading(false);
            return;
          }

          const newUser = { id: Date.now(), email: email.trim(), password, emailVerified: false };
          users.push(newUser);
          saveUsers(users);

          alert(`📧 [จำลองการส่งอีเมล]\n\nเราได้ส่งลิงก์ยืนยันตัวตนไปยัง: ${email}`);
          setAuthMode("login");
          resetForm();
          setLoading(false);
        }, 300);
      };

      const handleVerifyEmail = () => {
        if (!user) return;
        const users = getUsers();
        const updatedUsers = users.map(u => u.email === user.email ? { ...u, emailVerified: true } : u);
        saveUsers(updatedUsers);

        const updatedUser = { ...user, emailVerified: true };
        setCurrentUser(updatedUser);
        setUser(updatedUser);
        alert("✅ ยืนยันอีเมลเรียบร้อยแล้ว!");
      };

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const checkout = () => {
        if (!user) {
          alert(t.needLogin);
          setIsAuthOpen(true);
          return;
        }
        alert(`🎉 สั่งซื้อสำเร็จ! ยอดชำระทั้งหมด ฿${cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toLocaleString()}`);
        setCart([]);
        setIsCartOpen(false);
      };

      const resetForm = () => {
        setEmail(""); setPassword(""); setConfirmPassword(""); setErrorMessage(""); setSuccessMessage("");
      };

      return React.createElement("div", { className: "p-4 max-w-6xl mx-auto" },
        // Header
        React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-gray-800" },
          React.createElement("h1", { className: "text-xl font-bold text-blue-400 tracking-wide" }, t.storeTitle),
          
          React.createElement("div", { className: "flex items-center gap-3" },
            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border border-gray-800 rounded-lg text-xs hover:bg-gray-900"
            }, `🌐 ${lang}`),

            React.createElement("button", {
              onClick: () => setIsCartOpen(true),
              className: "relative px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-lg text-xs font-bold hover:bg-gray-700"
            },
              `🛒 ${t.cart}`,
              cart.length > 0 && React.createElement("span", { className: "absolute -top-1.5 -right-1.5 bg-blue-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold" }, cart.reduce((s, i) => s + i.qty, 0))
            ),

            user ? 
              React.createElement("div", { className: "flex items-center gap-3" },
                React.createElement("div", { className: "text-right" },
                  React.createElement("div", { className: "text-xs font-bold text-green-400" }, user.email),
                  React.createElement("div", { className: `text-[10px] ${user.emailVerified ? "text-blue-400" : "text-yellow-400"}` },
                    user.emailVerified ? `✓ ${t.emailVerified}` : `⚠️ ${t.emailNotVerified}`
                  )
                ),
                React.createElement("button", {
                  onClick: () => { localStorage.removeItem("app_current_user"); setUser(null); },
                  className: "px-3 py-1.5 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-bold hover:bg-red-600/40"
                }, t.logout)
              )
            :
              React.createElement("button", {
                onClick: () => { setAuthMode("login"); setIsAuthOpen(true); },
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 shadow-lg shadow-blue-600/20"
              }, `👤 ${t.login}`)
          )
        ),

        // แถบเตือนยืนยันอีเมล
        user && !user.emailVerified && React.createElement("div", { className: "mt-4 p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-2xl flex justify-between items-center text-xs text-yellow-300 animate-fade-in" },
          React.createElement("span", null, `⚠️ ${t.verifyNotice}`),
          React.createElement("button", {
            onClick: handleVerifyEmail,
            className: "px-3 py-1 bg-yellow-500 text-gray-950 font-bold rounded-lg hover:bg-yellow-400"
          }, "กดเพื่อยืนยันอีเมล (จำลอง)")
        ),

        // รายการสินค้า (Store Grid)
        React.createElement("main", { className: "mt-8" },
          React.createElement("h2", { className: "text-lg font-bold mb-6 text-gray-300" }, "💻 สินค้าทั้งหมด (RAM & SSD)"),
          React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" },
            PRODUCTS.map(product => 
              React.createElement("div", { key: product.id, className: "bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden hover:border-gray-700 transition-all flex flex-col justify-between" },
                React.createElement("img", { src: product.img, alt: product.name, className: "w-full h-40 object-cover" }),
                React.createElement("div", { className: "p-4 flex-1 flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "text-[10px] font-bold px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded border border-blue-500/20" }, product.category),
                    React.createElement("h3", { className: "text-sm font-bold mt-2 text-white line-clamp-2" }, product.name)
                  ),
                  React.createElement("div", { className: "mt-4 flex items-center justify-between" },
                    React.createElement("span", { className: "text-base font-extrabold text-blue-400" }, `฿${product.price.toLocaleString()}`),
                    React.createElement("button", {
                      onClick: () => addToCart(product),
                      className: "px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all"
                    }, t.addToCart)
                  )
                )
              )
            )
          )
        ),

        // Cart Drawer / Modal
        isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-end animate-fade-in" },
          React.createElement("div", { className: "w-full max-w-md bg-gray-900 h-full p-6 flex flex-col justify-between border-l border-gray-800" },
            React.createElement("div", null,
              React.createElement("div", { className: "flex justify-between items-center pb-4 border-b border-gray-800" },
                React.createElement("h2", { className: "text-lg font-bold" }, `🛒 ${t.cart}`),
                React.createElement("button", { onClick: () => setIsCartOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
              ),
              React.createElement("div", { className: "mt-4 space-y-3 max-h-[60vh] overflow-y-auto" },
                cart.length === 0 ? React.createElement("p", { className: "text-center text-gray-500 py-8 text-sm" }, t.emptyCart) :
                cart.map(item => 
                  React.createElement("div", { key: item.id, className: "flex justify-between items-center bg-gray-950 p-3 rounded-xl border border-gray-800" },
                    React.createElement("div", null,
                      React.createElement("div", { className: "text-xs font-bold text-white" }, item.name),
                      React.createElement("div", { className: "text-xs text-gray-400" }, `฿${item.price.toLocaleString()} x ${item.qty}`)
                    ),
                    React.createElement("div", { className: "text-sm font-bold text-blue-400" }, `฿${(item.price * item.qty).toLocaleString()}`)
                  )
                )
              )
            ),
            React.createElement("div", { className: "pt-4 border-t border-gray-800" },
              React.createElement("div", { className: "flex justify-between text-base font-bold mb-4" },
                React.createElement("span", null, t.total),
                React.createElement("span", { className: "text-blue-400" }, `฿${cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString()}`)
              ),
              React.createElement("button", {
                onClick: checkout,
                disabled: cart.length === 0,
                className: "w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-bold rounded-xl text-sm"
              }, t.checkout)
            )
          )
        ),

        // Auth Modal
        isAuthOpen && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in" },
          React.createElement("div", { className: "max-w-sm w-full bg-gray-900 border border-gray-800 rounded-3xl p-6 relative" },
            React.createElement("button", { onClick: () => { setIsAuthOpen(false); resetForm(); }, className: "absolute top-4 right-4 text-gray-500 hover:text-white" }, "✕"),
            React.createElement("div", { className: "flex border-b border-gray-800 mb-6" },
              React.createElement("button", { onClick: () => { setAuthMode("login"); resetForm(); }, className: `flex-1 pb-3 text-sm font-bold ${authMode === "login" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-500"}` }, t.login),
              React.createElement("button", { onClick: () => { setAuthMode("register"); resetForm(); }, className: `flex-1 pb-3 text-sm font-bold ${authMode === "register" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-500"}` }, t.register)
            ),
            errorMessage && React.createElement("div", { className: "mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs" }, errorMessage),
            React.createElement("form", { onSubmit: authMode === "login" ? handleLogin : handleRegister, className: "space-y-4" },
              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.email),
                React.createElement("input", { type: "email", required: true, value: email, onChange: (e) => setEmail(e.target.value), className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white" })
              ),
              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.password),
                React.createElement("input", { type: "password", required: true, value: password, onChange: (e) => setPassword(e.target.value), className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white" })
              ),
              authMode === "register" && React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.confirmPassword),
                React.createElement("input", { type: "password", required: true, value: confirmPassword, onChange: (e) => setConfirmPassword(e.target.value), className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white" })
              ),
              React.createElement("button", { type: "submit", disabled: loading, className: "w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm mt-2" }, loading ? "กำลังดำเนินการ..." : (authMode === "login" ? t.login : t.register))
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
