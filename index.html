          } else {

        } catch (error) {

        } finally {
          setLoading(false);
        }

        fetchProductsFromCloud();
      }, []);

        try {
          const batch = writeBatch(db);
          defaultData.forEach(prod => {
            const docRef = doc(db, "products", String(prod.id));
            batch.set(docRef, prod);
          });
          await batch.commit();
          setProducts(defaultData);

              key: cat,
              onClick: () => setFilter(cat),
              className: `px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${filter === cat ? "bg-blue-600 text-white shadow-md shadow-blue-500/20" : "bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"}`
            }, cat === "ALL" ? t.all : cat)
          )
        ),

        // Product Grid
        React.createElement("main", { className: "max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" },
          filteredProducts.map(product => {
            const minPrice = getMinPrice(product.stores);
            return React.createElement("div", { key: product.id, className: "bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-4 shadow-sm hover:shadow-lg transition-all flex flex-col justify-between group" },
              React.createElement("div", null,
                React.createElement("div", { className: "relative overflow-hidden rounded-lg mb-3 bg-gray-50 dark:bg-gray-900 p-2" },
                  React.createElement("img", { src: product.img, alt: product.name, className: "w-full h-40 object-contain group-hover:scale-105 transition-transform duration-300" }),
                  React.createElement("span", { className: "absolute top-2 left-2 text-[10px] font-black text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/80 border border-blue-200 dark:border-blue-800 px-2 py-0.5 rounded-md" }, product.type)
                ),
                React.createElement("h3", { className: "font-bold text-sm line-clamp-1 dark:text-white" }, product.name),
                React.createElement("p", { className: "text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2 h-8" }, product.spec),
                
                React.createElement("div", { className: "mt-3 pt-2 border-t border-gray-100 dark:border-gray-700 flex justify-between items-baseline" },
                  React.createElement("span", { className: "text-[11px] text-gray-400" }, "เริ่มต้น"),
                  minPrice ? React.createElement("span", { className: "text-base font-black text-blue-600 dark:text-blue-400" }, `฿${minPrice.toLocaleString()}`) : React.createElement("span", { className: "text-xs font-bold text-red-500" }, t.outOfStock)
                )
              ),

              React.createElement("div", { className: "mt-4 pt-2 flex flex-col gap-1.5" },
                React.createElement("button", { 
                  onClick: () => setSelectedProduct(product),
                  className: "w-full py-2 bg-gray-100 dark:bg-gray-700 hover:bg-blue-50 dark:hover:bg-blue-950 hover:text-blue-600 dark:hover:text-blue-400 text-gray-700 dark:text-gray-200 rounded-xl text-xs font-bold transition-colors"
                }, t.detail),
                
                isAdmin && React.createElement("button", { 
                  onClick: () => setEditingProduct(product),
                  className: "w-full py-1.5 bg-amber-500 text-white rounded-xl text-xs font-bold hover:bg-amber-600" 
                }, t.editProduct)
              )
            );
          })
        ),

        // Modal: Product Detail & Store Comparison
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" },
          React.createElement("div", { className: "bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 p-6 rounded-2xl max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto border border-gray-200 dark:border-gray-700 shadow-2xl" },
            React.createElement("div", { className: "flex justify-between items-start" },
              React.createElement("div", null,
                React.createElement("span", { className: "text-xs font-bold text-blue-600 dark:text-blue-400" }, selectedProduct.type),
                React.createElement("h2", { className: "text-lg font-extrabold" }, selectedProduct.name)
              ),
              React.createElement("button", { onClick: () => setSelectedProduct(null), className: "text-gray-400 hover:text-gray-600 text-xl font-bold" }, "✕")
            ),

            React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "w-full h-48 object-contain bg-gray-50 dark:bg-gray-900 rounded-xl p-2" }),
            
            React.createElement("div", { className: "bg-gray-50 dark:bg-gray-900 p-3 rounded-xl text-xs space-y-1" },
              React.createElement("p", { className: "font-semibold text-gray-600 dark:text-gray-300" }, selectedProduct.spec),
              React.createElement("p", { className: "text-gray-500 dark:text-gray-400 italic" }, selectedProduct.desc)
            ),

            React.createElement("div", { className: "space-y-2 pt-2" },
              React.createElement("h3", { className: "text-xs font-black uppercase text-gray-400" }, t.comparePrices),
              selectedProduct.stores.map((st, idx) => 
                React.createElement("div", { key: idx, className: "flex justify-between items-center p-3 border dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "font-bold text-sm block" }, st.name),
                    st.outOfStock ? React.createElement("span", { className: "text-[10px] text-red-500 font-bold" }, t.storeOutOfStock) : React.createElement("span", { className: "text-sm font-black text-blue-600 dark:text-blue-400" }, `฿${st.price.toLocaleString()}`)
                  ),
                  
                  React.createElement("div", { className: "flex gap-2" },
                    !st.outOfStock && React.createElement("button", { 
                      onClick: () => addToCart(selectedProduct, st),
                      className: "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700" 
                    }, `+ ${t.addToCart}`),
                    React.createElement("a", { href: st.url, target: "_blank", rel: "noreferrer", className: "px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs font-bold hover:bg-gray-100 dark:hover:bg-gray-700" }, t.buyAtStore)
                  )
                )
              )
            ),

            React.createElement("button", { onClick: () => setSelectedProduct(null), className: "w-full py-2 bg-gray-200 dark:bg-gray-700 text-xs font-bold rounded-xl mt-4" }, t.close)
          )
        ),

        // Modal: Cart Sidebar
        isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-end z-50" },
          React.createElement("div", { className: "bg-white dark:bg-gray-800 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl animate-fade-in" },
            React.createElement("div", { className: "space-y-4 overflow-y-auto" },
              React.createElement("div", { className: "flex justify-between items-center pb-3 border-b dark:border-gray-700" },
                React.createElement("h2", { className: "text-lg font-extrabold" }, t.itemsInCart),
                React.createElement("button", { onClick: () => setIsCartOpen(false), className: "text-gray-400 text-xl font-bold" }, "✕")
              ),

              cart.length === 0 ? React.createElement("p", { className: "text-center text-gray-400 text-sm py-10" }, "ไม่มีสินค้าในตะกร้า") :
              cart.map(item => 
                React.createElement("div", { key: item.cartId, className: "flex justify-between items-center p-3 border dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900" },
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("img", { src: item.img, className: "w-10 h-10 object-contain" }),
                    React.createElement("div", null,
                      React.createElement("h4", { className: "font-bold text-xs line-clamp-1" }, item.name),
                      React.createElement("span", { className: "text-[10px] text-gray-500" }, `ร้าน: ${item.storeName}`),
                      React.createElement("p", { className: "text-xs font-bold text-blue-600 dark:text-blue-400" }, `฿${item.price.toLocaleString()}`)
                    )
                  ),
                  React.createElement("button", { onClick: () => removeFromCart(item.cartId), className: "text-red-500 text-xs font-bold p-1 hover:bg-red-50 rounded" }, "ลบ")
                )
              )
            ),

            React.createElement("div", { className: "pt-4 border-t dark:border-gray-700 space-y-3" },
              React.createElement("div", { className: "flex justify-between text-base font-black" },
                React.createElement("span", null, t.total),
                React.createElement("span", { className: "text-blue-600 dark:text-blue-400" }, `฿${cartTotal.toLocaleString()}`)
              ),
              React.createElement("div", { className: "flex gap-2" },
                React.createElement("button", { onClick: () => setCart([]), className: "flex-1 py-2 bg-red-100 text-red-600 rounded-xl text-xs font-bold" }, t.clearCart),
                React.createElement("button", { onClick: () => setIsCartOpen(false), className: "flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold" }, t.close)
              )
            )
          )
        ),

        // Modal: Admin Login
        isLoginOpen && React.createElement("div", { className: "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("form", { onSubmit: handleLogin, className: "bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-sm w-full space-y-4 border dark:border-gray-700" },
            React.createElement("h2", { className: "text-lg font-extrabold" }, t.loginTitle),
            React.createElement("p", { className: "text-xs text-gray-500" }, `กรอกชื่อ "${ADMIN_USERNAME}" เพื่อเข้าโหมดแอดมิน`),
            React.createElement("input", {
              type: "text",
              value: usernameInput,
              onChange: (e) => setUsernameInput(e.target.value),
              placeholder: t.usernamePlaceholder,
              className: "w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2.5 rounded-xl text-sm outline-blue-500"
            }),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", { type: "button", onClick: () => setIsLoginOpen(false), className: "px-4 py-2 text-xs font-bold text-gray-500" }, t.cancel),
              React.createElement("button", { type: "submit", className: "px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl" }, t.login)
            )
          )
        ),

        // Modal: Edit Product (Admin)
        editingProduct && React.createElement("div", { className: "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: "bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto border dark:border-gray-700" },
            React.createElement("h2", { className: "text-lg font-extrabold" }, t.editProduct),
            
            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.productName),
              React.createElement("input", {
                type: "text",
                value: editingProduct.name,
                onChange: (e) => setEditingProduct({ ...editingProduct, name: e.target.value }),
                className: "w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2 rounded-lg text-sm"
              })
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.category),
              React.createElement("select", {
                value: editingProduct.type,
                onChange: (e) => setEditingProduct({ ...editingProduct, type: e.target.value }),
                className: "w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2 rounded-lg text-sm"
              }, ["CPU", "การ์ดจอ", "RAM", "SSD", "ชุดน้ำ", "เคสคอม", "ตกแต่ง/พัดลม"].map(c => React.createElement("option", { key: c, value: c }, c)))
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.imageUrl),
              React.createElement("input", {
                type: "text",
                value: editingProduct.img,
                onChange: (e) => setEditingProduct({ ...editingProduct, img: e.target.value }),
                className: "w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2 rounded-lg text-sm"
              })
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.spec),
              React.createElement("textarea", {
                value: editingProduct.spec,
                onChange: (e) => setEditingProduct({ ...editingProduct, spec: e.target.value }),
                className: "w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2 rounded-lg text-sm h-16"
              })
            ),

            React.createElement("div", { className: "flex justify-between items-center pt-3 border-t dark:border-gray-700" },
              React.createElement("button", { onClick: () => handleDeleteProduct(editingProduct.id), className: "px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold" }, t.delete),
              React.createElement("div", { className: "flex gap-2" },
                React.createElement("button", { onClick: () => setEditingProduct(null), className: "px-3 py-1.5 text-xs font-bold text-gray-500" }, t.cancel),
                React.createElement("button", { onClick: () => handleSaveProduct(editingProduct), className: "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold" }, t.save)
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
