  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }

    @keyframes slideTransition {
      from { opacity: 0; transform: scale(0.97) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .banner-slide-animate {
      animation: slideTransition 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-live { animation: pulseLive 2s infinite; }
  </style>

      {

        name: "Intel Core i7-14700K",
        type: "CPU",
        spec: "20 Cores (8P+12E) / 28 Threads / Up to 5.6GHz",
        img: "https://m.media-amazon.com/images/I/61S3S68f2SL._AC_SL1000_.jpg",
        desc: "ซีพียูไฮเอนด์สำหรับงานเรนเดอร์ สตรีมมิ่ง และเกมมิ่งระดับโปร",
        prices: [
          { store: "Shopee Mall", price: 16290, badge: "Lowest Price", productUrl: "https://shopee.co.th/search?keyword=i7-14700K", trusted: true },
          { store: "JIB Online", price: 16900, badge: "Official Store", productUrl: "https://www.jib.co.th/web/product/readProduct/62810", trusted: true },

        prices: [
          { store: "Shopee Mall", price: 1090, badge: "Lowest Price", productUrl: "https://shopee.co.th/search?keyword=Kingston+FURY+Beast+DDR4+8GB", trusted: true },

          { store: "Lazada LazMall", price: 1120, badge: "Verified", productUrl: "https://www.lazada.co.th/catalog/?q=Kingston+FURY+Beast+DDR4+8GB", trusted: true }
        ]
      },
      {
        id: 4,
        name: "Samsung 990 PRO NVMe",
        type: "SSD",
        spec: "2TB Read 7450MB/s",
        img: "https://m.media-amazon.com/images/I/71I3uAptInL._AC_SL1500_.jpg",
        desc: "SSD Gen4 ความเร็วสูง โหลดเกมไว ตอบสนองฉับไว",
        prices: [
          { store: "Shopee Mall", price: 6650, badge: "Lowest Price", productUrl: "https://shopee.co.th/search?keyword=Samsung+990+PRO+2TB", trusted: true },
          { store: "JIB Online", price: 6990, badge: "Official Store", productUrl: "https://www.jib.co.th/web/product/readProduct/57820", trusted: true },
          { store: "Lazada LazMall", price: 6790, badge: "Verified", productUrl: "https://www.lazada.co.th/catalog/?q=Samsung+990+PRO+2TB", trusted: true }
        ]
      },
      {
        id: 7,
        name: "NZXT Kraken 240 RGB",
        type: "ชุดน้ำ",
        spec: "Liquid Cooler 240mm",
        img: "https://m.media-amazon.com/images/I/51p1IAnuKBL._AC_SL1000_.jpg",
        desc: "ชุดน้ำปิดดีไซน์หรูหรา เย็นเฉียบ ไฟปรับแต่งได้อิสระ",
        prices: [
          { store: "Shopee Mall", price: 4750, badge: "Lowest Price", productUrl: "https://shopee.co.th/search?keyword=NZXT+Kraken+240+RGB", trusted: true },
          { store: "JIB Online", price: 4990, badge: "Official Store", productUrl: "https://www.jib.co.th/web/product/readProduct/59120", trusted: true },
          { store: "Lazada LazMall", price: 4890, badge: "Verified", productUrl: "https://www.lazada.co.th/catalog/?q=NZXT+Kraken+240+RGB", trusted: true }
        ]
      }
    ];

    function App() {
      const [lang, setLang] = useState("TH");
      const [theme, setTheme] = useState("light");
      const [filter, setFilter] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isRecentOpen, setIsRecentOpen] = useState(false);
      const [recentlyViewed, setRecentlyViewed] = useState([]);
      
      const [currentNews, setCurrentNews] = useState(TECH_NEWS_POOL[0]);
      const [lastSyncTime, setLastSyncTime] = useState(new Date().toLocaleTimeString());

      const t = TEXTS[lang];

      useEffect(() => {
        const timer = setInterval(() => {
          setLastSyncTime(new Date().toLocaleTimeString());
        }, 5000);
        return () => clearInterval(timer);
      }, []);

      const getBestPrice = (prices) => {
        const trustedPrices = prices.filter(p => p.trusted);
        return trustedPrices.reduce((min, p) => p.price < min.price ? p : min, trustedPrices[0]);
      };

      const addToCart = (product) => {
        const best = getBestPrice(product.prices);
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, price: best.price, store: best.store, productUrl: best.productUrl, qty: 1 }];
        });
      };

      // ฟังก์ชันเปิดไปหน้าสินค้าตรงๆ
      const openProductPage = (url) => {
        window.open(url, "_blank", "noopener,noreferrer");
      };

      const handleCheckout = () => {
        cart.forEach(item => {
          openProductPage(item.productUrl);
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const openProductDetails = (product) => {
        setSelectedProduct(product);
        setRecentlyViewed(prev => [product, ...prev.filter(p => p.id !== product.id)]);
      };

      const toggleTheme = () => {
        if (theme === "light") setTheme("dark");
        else if (theme === "dark") setTheme("mono");
        else setTheme("light");
      };

      const filteredProducts = PRODUCTS.filter(p => {
        const matchFilter = filter === "ALL" || p.type === filter;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchFilter && matchSearch;
      });

      const totalCartPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const totalCartItems = cart.reduce((sum, item) => sum + item.qty, 0);

      const getThemeClass = () => {
        if (theme === "dark") return "bg-gray-900 text-white min-h-screen p-4 sm:p-6 transition-colors duration-300";
        if (theme === "mono") return "bg-black text-gray-200 grayscale min-h-screen p-4 sm:p-6 transition-colors duration-300";
        return "bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-6 transition-colors duration-300";
      };

      const cardBgClass = theme === "light" ? "bg-white border-gray-200" : "bg-gray-800 border-gray-700";

      return React.createElement("div", { className: getThemeClass() },
        
        // Header
        React.createElement("header", { className: "flex flex-col md:flex-row justify-between items-center pb-4 border-b border-gray-300 dark:border-gray-700 max-w-5xl mx-auto gap-4" },
          React.createElement("div", null,
            React.createElement("h1", { className: "text-2xl font-extrabold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent" }, t.storeTitle),
            React.createElement("p", { className: "text-xs opacity-70 font-medium" }, t.subtitle)
          ),
          
          React.createElement("div", { className: "flex flex-wrap gap-2 items-center justify-center" },
            React.createElement("div", { className: "text-[11px] bg-blue-500/10 border border-blue-500/30 px-3 py-1 rounded-lg flex items-center gap-1.5 text-blue-400 font-mono" },
              React.createElement("span", { className: "w-2 h-2 rounded-full bg-green-500 animate-live" }),
              React.createElement("span", null, `${t.lastUpdate} ${lastSyncTime}`)
            ),

            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border rounded-lg text-xs font-bold bg-blue-500/10 text-blue-500"
            }, `🌐 ${lang}`),

            React.createElement("button", {
              onClick: toggleTheme,
              className: "px-2.5 py-1 border rounded-lg text-xs"
            }, `${t.theme}: ${theme.toUpperCase()}`),

            React.createElement("button", {
              onClick: () => setIsRecentOpen(true),
              className: "px-2.5 py-1 border rounded-lg text-xs"
            }, `👁️ ${t.recent} (${recentlyViewed.length})`),

            React.createElement("button", {
              onClick: () => setIsCartOpen(true),
              className: "px-3 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-md hover:bg-blue-700"
            }, `🛒 ${t.cart} (${totalCartItems})`)
          )
        ),

        // Main Content
        React.createElement("main", { className: "max-w-5xl mx-auto mt-6" },
          
          // Banner
          React.createElement("div", { className: "relative mb-6 rounded-2xl overflow-hidden shadow-lg border border-gray-700/50 bg-slate-950" },
            React.createElement("div", { className: `bg-gradient-to-r ${currentNews.bg} text-white p-6 flex flex-col md:flex-row items-center justify-between gap-4` },
              React.createElement("div", { className: "space-y-1" },
                React.createElement("span", { className: "text-[10px] font-bold px-2 py-0.5 bg-blue-500/30 border border-blue-400/40 rounded-full" }, currentNews.badge),
                React.createElement("h2", { className: "text-lg font-bold" }, currentNews.title),
                React.createElement("p", { className: "text-xs text-gray-200" }, currentNews.desc)
              )
            )
          ),

          // Search & Filters
          React.createElement("div", { className: "flex flex-col sm:flex-row justify-between items-center gap-4 mb-6" },
            React.createElement("div", { className: "flex gap-2 overflow-x-auto pb-1 w-full sm:w-auto" },
              [
                { key: "ALL", label: t.all },
                { key: "CPU", label: t.cpu },
                { key: "RAM", label: t.ram },
                { key: "SSD", label: t.ssd },
                { key: "ชุดน้ำ", label: t.cooler }
              ].map(f =>
                React.createElement("button", {
                  key: f.key,
                  onClick: () => setFilter(f.key),
                  className: `px-4 py-1.5 rounded-full text-xs font-semibold ${filter === f.key ? "bg-blue-600 text-white" : "border hover:bg-gray-500/10"}`
                }, f.label)
              )
            ),

            React.createElement("div", { className: "w-full sm:w-64" },
              React.createElement("input", {
                type: "text",
                placeholder: t.searchPlaceholder,
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                className: "w-full px-3.5 py-1.5 text-xs border rounded-xl bg-transparent focus:outline-none focus:border-blue-500"
              })
            )
          ),

          // Product Grid
          React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 animate-fade-in" },
            filteredProducts.map(p => {
              const best = getBestPrice(p.prices);
              return React.createElement("div", { key: p.id, className: `border rounded-xl overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-md transition-all ${cardBgClass}` },
                React.createElement("div", { 
                  onClick: () => openProductDetails(p),
                  className: "w-full h-44 bg-white flex items-center justify-center p-4 relative cursor-pointer" 
                },
                  React.createElement("span", { className: "absolute top-2 right-2 bg-green-500/20 text-green-500 border border-green-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full" }, best.store),
                  React.createElement("img", { src: p.img, alt: p.name, className: "max-h-full max-w-full object-contain" })
                ),
                React.createElement("div", { className: "p-4 flex-grow flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "text-[10px] border px-1.5 py-0.5 rounded font-mono font-bold" }, p.type),
                    React.createElement("h3", { className: "font-bold text-sm mt-1" }, p.name),
                    React.createElement("p", { className: "text-xs opacity-75 mt-0.5" }, p.spec)
                  ),
                  React.createElement("div", { className: "mt-4 pt-3 border-t border-gray-500/20 space-y-2" },
                    React.createElement("div", { className: "flex justify-between items-end" },
                      React.createElement("div", null,
                        React.createElement("span", { className: "text-[10px] opacity-60 block" }, t.bestPrice),
                        React.createElement("span", { className: "font-bold text-base text-blue-500" }, `฿${best.price.toLocaleString()}`)
                      ),
                      React.createElement("button", {
                        onClick: () => openProductDetails(p),
                        className: "text-[11px] text-gray-500 hover:underline"
                      }, t.compareBtn)
                    ),
                    React.createElement("button", {
                      onClick: () => addToCart(p),
                      className: "w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold shadow"
                    }, `🛒 ${t.addToCart}`)
                  )
                )
              );
            })
          )
        ),

        // Modal ตะกร้าสินค้า
        isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[85vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `🛒 ${t.cart}`),
              React.createElement("button", { onClick: () => setIsCartOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3" },
              cart.length === 0 ? React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.emptyCart) :
              cart.map(item => 
                React.createElement("div", { key: item.id, className: "flex items-center justify-between p-2.5 border rounded-xl bg-gray-500/5" },
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("img", { src: item.img, alt: item.name, className: "w-10 h-10 object-contain bg-white rounded p-1" }),
                    React.createElement("div", null,
                      React.createElement("p", { className: "font-bold text-xs" }, item.name),
                      React.createElement("p", { className: "text-[10px] text-blue-400" }, `฿${item.price.toLocaleString()} (${item.store})`),
                      React.createElement("button", {
                        onClick: () => openProductPage(item.productUrl),
                        className: "text-[10px] text-green-500 hover:underline font-bold block"
                      }, "ไปที่หน้าสินค้า ↗")
                    )
                  ),
                  React.createElement("div", { className: "flex items-center gap-2" },
                    React.createElement("button", { onClick: () => updateQty(item.id, -1), className: "px-2 py-0.5 border rounded text-xs" }, "-"),
                    React.createElement("span", { className: "text-xs font-bold" }, item.qty),
                    React.createElement("button", { onClick: () => updateQty(item.id, 1), className: "px-2 py-0.5 border rounded text-xs" }, "+")
                  )
                )
              )
            ),
            React.createElement("div", { className: "pt-3 border-t border-gray-500/30 space-y-3" },
              React.createElement("div", { className: "flex justify-between items-center" },
                React.createElement("span", { className: "text-xs font-bold" }, t.total),
                React.createElement("span", { className: "text-lg font-black text-blue-500" }, `฿${totalCartPrice.toLocaleString()}`)
              ),
              React.createElement("button", {
                disabled: cart.length === 0,
                onClick: handleCheckout,
                className: "w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-500 text-white py-2 rounded-xl text-xs font-bold shadow"
              }, t.checkout)
            )
          )
        ),

        // Modal รายละเอียดเปรียบเทียบราคาแยกตามร้าน
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("div", { className: "bg-white p-4 rounded-xl mb-3 flex items-center justify-center h-36" },
              React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "max-h-full max-w-full object-contain" })
            ),
            React.createElement("h2", { className: "text-base font-bold" }, selectedProduct.name),
            React.createElement("p", { className: "text-xs opacity-75 mb-3" }, selectedProduct.desc),
            
            React.createElement("div", { className: "space-y-2 mb-4" },
              selectedProduct.prices.map((item, idx) =>
                React.createElement("div", { key: idx, className: "flex justify-between items-center p-2 border rounded-xl bg-gray-500/5" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "font-bold text-xs block" }, item.store),
                    React.createElement("span", { className: "text-[10px] text-green-500 font-medium" }, item.badge)
                  ),
                  React.createElement("div", { className: "flex items-center gap-2" },
                    React.createElement("span", { className: "font-bold text-xs text-blue-500" }, `฿${item.price.toLocaleString()}`),
                    React.createElement("button", {
                      onClick: () => openProductPage(item.productUrl),
                      className: "bg-orange-500 hover:bg-orange-600 text-white px-2 py-1 rounded text-[10px] font-bold"
                    }, t.goToProduct)
                  )
                )
              )
            ),

            React.createElement("div", { className: "flex justify-between gap-2" },
              React.createElement("button", {
                onClick: () => {
                  addToCart(selectedProduct);
                  setSelectedProduct(null);
                },
                className: "flex-1 bg-blue-600 text-white py-1.5 rounded-xl text-xs font-bold"
              }, `🛒 ${t.addToCart}`),
              React.createElement("button", {
                onClick: () => setSelectedProduct(null),
                className: "px-4 py-1.5 border rounded-xl text-xs font-semibold"
              }, t.close)
            )
          )
        ),

        // Modal ประวัติ
        isRecentOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `👁️ ${t.recent}`),
              React.createElement("button", { onClick: () => setIsRecentOpen(false) }, "✕")
            ),
            React.createElement("div", { className: "py-4 space-y-2 max-h-60 overflow-y-auto" },
              recentlyViewed.length === 0 ? React.createElement("p", { className: "text-center text-xs opacity-50 py-4" }, t.noRecent) :
              recentlyViewed.map(item => React.createElement("div", { key: item.id, className: "p-2 border rounded text-xs font-bold" }, item.name))
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
