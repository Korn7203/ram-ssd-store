        const savedNew = localStorage.getItem("korn_pc_products");
        const savedOld = localStorage.getItem("products");
        const saved = savedNew || savedOld;
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            console.error("Failed to parse local storage products", e);
          }
        }
        return INITIAL_PRODUCTS;

        const dataStr = JSON.stringify(products);
        localStorage.setItem("korn_pc_products", dataStr);
        localStorage.setItem("products", dataStr);
      }, [products]);

      const getRandomNews = () => {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * TECH_NEWS_POOL.length);
        } while (TECH_NEWS_POOL[randomIndex].id === currentNews.id && TECH_NEWS_POOL.length > 1);
        
        setCurrentNews(TECH_NEWS_POOL[randomIndex]);
        setAnimKey(Date.now());
      };

      useEffect(() => {
        const timer = setInterval(() => {
          getRandomNews();
        }, 5000);
        return () => clearInterval(timer);
      }, [currentNews]);

      const toggleTheme = () => {
        if (theme === "light") setTheme("dark");
        else if (theme === "dark") setTheme("mono");
        else setTheme("light");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (usernameInput.trim()) {
          setUser(usernameInput.trim());
          setIsLoginOpen(false);
          setUsernameInput("");
        }
      };

      const handleLogout = () => setUser(null);

      const openDirectLink = (product, store) => {
        const newRecord = {
          id: Date.now(),
          date: new Date().toLocaleString(),
          store: store.name,
          items: [{ name: product.name, price: store.price }],
          total: store.price
        };
        setOrderHistory(prev => [newRecord, ...prev]);
        window.open(store.url, "_blank", "noopener,noreferrer");
      };

      const openProductDetails = (product) => {
        setSelectedProduct(product);
        setRecentlyViewed(prev => {
          const filtered = prev.filter(p => p.id !== product.id);
          return [product, ...filtered];
        });
      };

      const addToCart = (product, store) => {
        setCart([...cart, { ...product, selectedStore: store, cartItemId: Date.now() + Math.random() }]);
        setCartAnimate(true);
        setTimeout(() => setCartAnimate(false), 300);
      };

      const removeFromCart = (cartItemId) => {
        setCart(cart.filter(item => item.cartItemId !== cartItemId));
      };

      const handleSaveProduct = (updatedProduct) => {
        setProducts(prev => {
          const exists = prev.some(p => p.id === updatedProduct.id);
          if (exists) {
            return prev.map(p => p.id === updatedProduct.id ? updatedProduct : p);
          } else {
            return [updatedProduct, ...prev];
          }
        });
        setEditingProduct(null);
      };

            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", {
                type: "button",
                onClick: () => setIsLoginOpen(false),
                className: "px-3 py-1.5 border rounded-xl text-xs font-semibold"
              }, t.cancel),
              React.createElement("button", {
                type: "submit",
                className: "px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all"
              }, t.login)
            )
          )
        ),

        isHistoryOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `📜 ${t.history}`),
              React.createElement("button", { onClick: () => setIsHistoryOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3" },
              orderHistory.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noHistory)
              :
                orderHistory.map(order =>
                  React.createElement("div", { key: order.id, className: "p-3 border border-gray-500/20 rounded-xl bg-gray-500/5 text-xs" },
                    React.createElement("div", { className: "flex justify-between text-gray-400 mb-1" },
                      React.createElement("span", null, order.date),
                      React.createElement("span", { className: "font-bold text-orange-400" }, order.store)
                    ),
                    order.items.map((item, idx) =>
                      React.createElement("div", { key: idx, className: "flex justify-between py-1" },
                        React.createElement("span", null, item.name),
                        React.createElement("span", { className: "font-semibold text-blue-400" }, `฿${item.price.toLocaleString()}`)
                      )
                    )
                  )
                )
            )
          )
        ),

        isRecentOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `👁️ ${t.recent}`),
              React.createElement("button", { onClick: () => setIsRecentOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-2" },
              recentlyViewed.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noRecent)
              :
                recentlyViewed.map(item =>
                  React.createElement("div", {
                    key: item.id,
                    onClick: () => {
                      setIsRecentOpen(false);
                      openProductDetails(item);
                    },
                    className: "flex items-center gap-3 p-2 border border-gray-500/20 rounded-xl bg-gray-500/5 hover:bg-gray-500/10 cursor-pointer transition-all"
                  },
                    React.createElement("img", { src: item.img, alt: item.name, className: `w-10 h-10 object-contain bg-white rounded p-1 ${item.outOfStock ? 'grayscale opacity-70' : ''}` }),
                    React.createElement("div", { className: "flex-grow min-w-0" },
                      React.createElement("p", { className: "font-bold text-xs truncate" }, item.name),
                      item.outOfStock
                        ? React.createElement("p", { className: "text-xs text-red-500 font-bold" }, t.outOfStock)
                        : React.createElement("p", { className: "text-xs text-blue-400" }, `เริ่มต้น ฿${getMinPrice(item.stores).toLocaleString()}`)
                    )
                  )
                )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
