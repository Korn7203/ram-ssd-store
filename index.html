  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN PC Store - Full System with Cloud Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes cartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .animate-cart-pop { animation: cartPop 0.3s ease-in-out; }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    // Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc, 
      setDoc, 
      deleteDoc, 
      writeBatch

    // 🔴 ค่า Config Firebase ของคุณถูกใส่ให้เรียบร้อยแล้ว
    const firebaseConfig = {
      apiKey: "AIzaSyAGUQECXDSXkQppta3TsAV_-MbVq61NEyQ",
      authDomain: "ssd-store-94f06.firebaseapp.com",
      projectId: "ssd-store-94f06",
      storageBucket: "ssd-store-94f06.firebasestorage.app",
      messagingSenderId: "1029401781194",
      appId: "1:1029401781194:web:4eaab8e229fbde73856533",
      measurementId: "G-V56W779QCY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_USERNAME = "musicnoa7";

    const TEXTS = {
      TH: {
        storeTitle: "KORN PC HARDWARE STORE",
        theme: "โหมด",
        cart: "ตะกร้า",
        login: "เข้าสู่ระบบ",
        logout: "ออกจากระบบ",
        all: "ทั้งหมด",
        cpu: "CPU",
        gpu: "การ์ดจอ",
        ram: "RAM",
        ssd: "SSD",
        cooler: "ชุดน้ำ",
        cases: "เคสคอม",
        acc: "ตกแต่ง/พัดลม",
        detail: "รายละเอียด / เปรียบเทียบ",
        cancel: "ยกเลิก",
        addToCart: "ใส่ตะกร้า",
        total: "ราคารวมทั้งหมด",
        clearCart: "ล้างตะกร้าทั้งหมด",
        loginTitle: "เข้าสู่ระบบ",
        usernamePlaceholder: "กรอกชื่อผู้ใช้งาน...",
        close: "ปิด",
        adminMode: "แอดมิน",
        userMode: "ลูกค้าทั่วไป",
        editProduct: "แก้ไขสินค้า",
        addProduct: "เพิ่มสินค้าใหม่",
        save: "บันทึกข้อมูลลง Cloud",
        delete: "ลบสินค้า",

        productName: "ชื่อสินค้า",
        spec: "สเปกสินค้า",
        category: "หมวดหมู่",
        resetData: "คืนค่าเริ่มต้น Cloud",
        outOfStock: "สินค้าหมดทุกร้าน",
        storeOutOfStock: "สินค้าหมด"
      },
      EN: {
        storeTitle: "KORN PC HARDWARE STORE",
        theme: "Theme",
        cart: "Cart",
        login: "Login",
        logout: "Logout",
        all: "ALL",
        cpu: "CPU",
        gpu: "GPU",
        ram: "RAM",
        ssd: "SSD",
        cooler: "Coolers",
        cases: "Cases",
        acc: "Decor & Fans",
        detail: "Details / Compare",
        cancel: "Cancel",
        addToCart: "Add to Cart",
        total: "Total Price",
        clearCart: "Clear Cart",
        loginTitle: "Sign In",
        usernamePlaceholder: "Enter username...",
        close: "Close",
        adminMode: "Admin",
        userMode: "Customer",
        editProduct: "Edit Product",
        addProduct: "Add New Product",
        save: "Save to Cloud",
        delete: "Delete",
        imageUrl: "Image URL",
        productName: "Product Name",
        spec: "Specifications",
        category: "Category",
        resetData: "Reset Cloud Data",
        outOfStock: "Out of Stock All Stores",
        storeOutOfStock: "Out of Stock"
      }
    };

    const INITIAL_PRODUCTS = [
      { 
        id: 101, name: "Intel Core i5-13400F", type: "CPU", spec: "10 Cores (6P+4E) / 16 Threads / Up to 4.6GHz / LGA1700", 
        img: "https://www.autonetpc.com/wp-content/uploads/2023/01/2022122610011856972_3.webp", desc: "ซีพียูราคาสุดคุ้มสำหรับการเล่นเกมและความบันเทิง",
        stores: [
          { name: "JIB", price: 5190, url: "https://www.jib.co.th/web/product/readProduct/56972", outOfStock: true },
          { name: "Advice", price: 4950, url: "https://www.advice.co.th/product/A0148187", outOfStock: false },
          { name: "Shopee", price: 6300, url: "https://shopee.co.th", outOfStock: false }
        ]
      },
      { 
        id: 102, name: "Intel Core i7-14700K", type: "CPU", spec: "20 Cores (8P+12E) / 28 Threads / Up to 5.6GHz / LGA1700", 
        img: "https://ihcupload-bkk.s3.ap-southeast-7.amazonaws.com/img/product/product40473_800.jpg", desc: "ซีพียูระดับท็อปสำหรับสตรีมเมอร์และงานกราฟิกหนักๆ",
        stores: [
          { name: "JIB", price: 12900, url: "https://www.jib.co.th/web/product/readProduct/63038", outOfStock: false },
          { name: "Advice", price: 14510, url: "https://www.advice.co.th", outOfStock: false },
          { name: "Shopee", price: 15550, url: "https://shopee.co.th", outOfStock: true }
        ]
      },
      { 
        id: 201, name: "ASUS ROG Strix RTX 4070 Ti Super", type: "การ์ดจอ", spec: "16GB GDDR6X / 256-bit / Tri-Fan RGB", 
        img: "https://dlcdnrog.asus.com/rog/media/1704760236894.webp", desc: "การ์ดจอเล่นเกม 4K สเปกโหด ดีไซน์พรีเมียมจาก ROG",
        stores: [
          { name: "JIB", price: 35900, url: "https://www.jib.co.th", outOfStock: false },
          { name: "Advice", price: 35500, url: "https://www.advice.co.th", outOfStock: false },
          { name: "Shopee", price: 34900, url: "https://shopee.co.th", outOfStock: false }
        ]
      },
      { 
        id: 4, name: "Samsung 990 PRO", type: "SSD", spec: "1TB NVMe PCIe 4.0 (Read 7450MB/s)", 
        img: "https://down-th.img.susercontent.com/file/sg-11134201-7rd71-m7m55wvhh51j4b@resize_w900_nl.webp", desc: "SSD ตัวแรงระดับเรือธงจาก Samsung",
        stores: [
          { name: "JIB", price: 4290, url: "https://www.jib.co.th", outOfStock: false },
          { name: "Advice", price: 4150, url: "https://www.advice.co.th", outOfStock: false },
          { name: "Shopee", price: 3990, url: "https://shopee.co.th", outOfStock: false }
        ]
      }
    ];

    function App() {
      const [lang, setLang] = useState("TH");
      const [theme, setTheme] = useState("light");
      const [user, setUser] = useState(null);
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      
      const [cart, setCart] = useState([]);
      const [filter, setFilter] = useState("ALL");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [editingProduct, setEditingProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [usernameInput, setUsernameInput] = useState("");

      const t = TEXTS[lang];
      const isAdmin = user === ADMIN_USERNAME;

      // 1. ดึงข้อมูลทั้งหมดจาก Firestore คลาวด์
      const fetchProductsFromCloud = async () => {
        setLoading(true);
        try {
          const querySnapshot = await getDocs(collection(db, "products"));
          const items = [];
          querySnapshot.forEach((doc) => {
            items.push(doc.data());
          });

          if (items.length === 0) {
            await resetToDefaultCloud(INITIAL_PRODUCTS);
          } else {
            setProducts(items);
          }
        } catch (error) {
          console.error("Error fetching data:", error);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchProductsFromCloud();
      }, []);

      // 2. บันทึก/แก้ไข สินค้าลง คลาวด์
      const handleSaveProduct = async (updatedProduct) => {
        try {
          await setDoc(doc(db, "products", String(updatedProduct.id)), updatedProduct);
          setProducts(prev => {
            const exists = prev.some(p => p.id === updatedProduct.id);
            return exists ? prev.map(p => p.id === updatedProduct.id ? updatedProduct : p) : [updatedProduct, ...prev];
          });
          setEditingProduct(null);
          alert("บันทึกข้อมูลสำเร็จ! ทุกคนจะเห็นข้อมูลนี้ตรงกันทันที");
        } catch (error) {
          alert("บันทึกไม่สำเร็จ: " + error.message);
        }
      };

      // 3. ลบสินค้าออกจาก คลาวด์
      const handleDeleteProduct = async (id) => {
        if (confirm("ต้องการลบสินค้านี้ใช่หรือไม่? (จะลบออกสำหรับทุกคน)")) {
          try {
            await deleteDoc(doc(db, "products", String(id)));
            setProducts(prev => prev.filter(p => p.id !== id));
            setEditingProduct(null);
            alert("ลบสินค้าเรียบร้อยแล้ว");
          } catch (error) {
            alert("ลบสินค้าไม่สำเร็จ: " + error.message);
          }
        }
      };

      // 4. คืนค่าเริ่มต้นให้ คลาวด์
      const resetToDefaultCloud = async (defaultData) => {
        try {
          const batch = writeBatch(db);
          defaultData.forEach(prod => {
            const docRef = doc(db, "products", String(prod.id));
            batch.set(docRef, prod);
          });
          await batch.commit();
          setProducts(defaultData);
        } catch (e) {
          console.error("Reset error:", e);
        }
      };

      const handleResetData = () => {
        if (confirm("คุณต้องการล้างข้อมูลแล้วคืนค่าเริ่มต้นให้ Cloud ใช่หรือไม่?")) {
          resetToDefaultCloud(INITIAL_PRODUCTS);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (usernameInput.trim()) {
          setUser(usernameInput.trim());
          setIsLoginOpen(false);
          setUsernameInput("");
        }
      };

      const filteredProducts = filter === "ALL" ? products : products.filter(p => p.type === filter);

      if (loading) {
        return React.createElement("div", { className: "min-h-screen flex flex-col items-center justify-center bg-gray-900 text-white font-bold gap-3" },
          React.createElement("div", { className: "w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin" }),
          React.createElement("p", null, "กำลังเชื่อมต่อคลาวด์ และดึงข้อมูลสินค้าล่าสุด...")
        );
      }

      return React.createElement("div", { className: "min-h-screen p-4 sm:p-6 transition-colors bg-gray-50 text-gray-900" },
        // Header
        React.createElement("header", { className: "flex flex-col md:flex-row justify-between items-center pb-4 border-b border-gray-300 max-w-6xl mx-auto gap-4" },
          React.createElement("div", { className: "flex items-center gap-2" },
            React.createElement("h1", { className: "text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent" }, t.storeTitle),
            React.createElement("span", { className: "text-xs bg-green-100 text-green-700 font-semibold px-2 py-0.5 rounded-full border border-green-300" }, "🟢 Cloud Realtime")
          ),
          
          React.createElement("div", { className: "flex flex-wrap gap-2 items-center" },
            React.createElement("button", { onClick: () => setLang(lang === "TH" ? "EN" : "TH"), className: "px-3 py-1.5 border rounded-lg text-xs font-bold bg-blue-50 hover:bg-blue-100 text-blue-600" }, lang),
            
            user ? React.createElement("div", { className: "flex items-center gap-2" },
              React.createElement("span", { className: "text-xs font-bold px-2.5 py-1 bg-amber-100 text-amber-800 rounded-md border border-amber-300" }, isAdmin ? t.adminMode : t.userMode + `: ${user}`),
              React.createElement("button", { onClick: () => setUser(null), className: "px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-bold hover:bg-red-600" }, t.logout)
            ) : React.createElement("button", { onClick: () => setIsLoginOpen(true), className: "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700" }, t.login)
          )
        ),

        // Admin Action Bar
        isAdmin && React.createElement("div", { className: "max-w-6xl mx-auto mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex flex-wrap gap-2 justify-between items-center" },
          React.createElement("span", { className: "text-xs font-bold text-amber-800" }, "⚡ โหมดแอดมิน: คุณสามารถเพิ่ม แก้ไข หรือลบสินค้าขึ้น Cloud ได้ทันที"),
          React.createElement("div", { className: "flex gap-2" },
            React.createElement("button", { 
              onClick: () => setEditingProduct({
                id: Date.now(),
                name: "สินค้าใหม่",
                type: "CPU",
                spec: "ระบุสเปก...",
                img: "https://via.placeholder.com/300",
                desc: "คำอธิบาย...",
                stores: [
                  { name: "JIB", price: 1000, url: "https://www.jib.co.th", outOfStock: false },
                  { name: "Advice", price: 1000, url: "https://www.advice.co.th", outOfStock: false }
                ]
              }),
              className: "px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded hover:bg-emerald-700"
            }, `+ ${t.addProduct}`),
            React.createElement("button", { onClick: handleResetData, className: "px-3 py-1 bg-gray-600 text-white text-xs font-bold rounded hover:bg-gray-700" }, t.resetData)
          )
        ),

        // Filter Categories
        React.createElement("div", { className: "flex gap-2 overflow-x-auto py-4 max-w-6xl mx-auto" },
          ["ALL", "CPU", "การ์ดจอ", "RAM", "SSD", "ชุดน้ำ", "เคสคอม", "ตกแต่ง/พัดลม"].map(cat => 
            React.createElement("button", {
              key: cat,
              onClick: () => setFilter(cat),
              className: `px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${filter === cat ? "bg-blue-600 text-white shadow-md" : "bg-white border text-gray-700 hover:bg-gray-100"}`
            }, cat === "ALL" ? t.all : cat)
          )
        ),

        // Product Grid
        React.createElement("main", { className: "max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" },
          filteredProducts.map(product => 
            React.createElement("div", { key: product.id, className: "bg-white border rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between" },
              React.createElement("div", null,
                React.createElement("img", { src: product.img, alt: product.name, className: "w-full h-40 object-contain mb-3" }),
                React.createElement("span", { className: "text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded" }, product.type),
                React.createElement("h3", { className: "font-bold text-sm mt-1 line-clamp-1" }, product.name),
                React.createElement("p", { className: "text-xs text-gray-500 mt-1 line-clamp-2" }, product.spec)
              ),
              React.createElement("div", { className: "mt-4 pt-3 border-t flex gap-2" },
                isAdmin && React.createElement("button", { 
                  onClick: () => setEditingProduct(product),
                  className: "flex-1 py-1.5 bg-amber-500 text-white rounded text-xs font-bold hover:bg-amber-600" 
                }, t.editProduct)
              )
            )
          )
        ),

        // Modal: Login
        isLoginOpen && React.createElement("div", { className: "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" },
          React.createElement("form", { onSubmit: handleLogin, className: "bg-white p-6 rounded-xl max-w-sm w-full space-y-4" },
            React.createElement("h2", { className: "text-lg font-bold" }, t.loginTitle),
            React.createElement("p", { className: "text-xs text-gray-500" }, `กรอกชื่อ "${ADMIN_USERNAME}" เพื่อเข้าใช้งานโหมดแอดมิน`),
            React.createElement("input", {
              type: "text",
              value: usernameInput,
              onChange: (e) => setUsernameInput(e.target.value),
              placeholder: t.usernamePlaceholder,
              className: "w-full border p-2 rounded text-sm outline-blue-500"
            }),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", { type: "button", onClick: () => setIsLoginOpen(false), className: "px-4 py-1.5 text-xs font-bold text-gray-500" }, t.cancel),
              React.createElement("button", { type: "submit", className: "px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded" }, t.login)
            )
          )
        ),

        // Modal: Edit Product (Admin)
        editingProduct && React.createElement("div", { className: "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: "bg-white p-6 rounded-xl max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto" },
            React.createElement("h2", { className: "text-lg font-bold" }, t.editProduct),
            
            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.productName),
              React.createElement("input", {
                type: "text",
                value: editingProduct.name,
                onChange: (e) => setEditingProduct({ ...editingProduct, name: e.target.value }),
                className: "w-full border p-1.5 rounded text-sm"
              })
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.category),
              React.createElement("select", {
                value: editingProduct.type,
                onChange: (e) => setEditingProduct({ ...editingProduct, type: e.target.value }),
                className: "w-full border p-1.5 rounded text-sm"
              }, ["CPU", "การ์ดจอ", "RAM", "SSD", "ชุดน้ำ", "เคสคอม", "ตกแต่ง/พัดลม"].map(c => React.createElement("option", { key: c, value: c }, c)))
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.imageUrl),
              React.createElement("input", {
                type: "text",
                value: editingProduct.img,
                onChange: (e) => setEditingProduct({ ...editingProduct, img: e.target.value }),
                className: "w-full border p-1.5 rounded text-sm"
              })
            ),

            React.createElement("div", null,
              React.createElement("label", { className: "text-xs font-bold" }, t.spec),
              React.createElement("textarea", {
                value: editingProduct.spec,
                onChange: (e) => setEditingProduct({ ...editingProduct, spec: e.target.value }),
                className: "w-full border p-1.5 rounded text-sm h-20"
              })
            ),

            React.createElement("div", { className: "flex justify-between items-center pt-2 border-t" },
              React.createElement("button", { onClick: () => handleDeleteProduct(editingProduct.id), className: "px-3 py-1.5 bg-red-600 text-white rounded text-xs font-bold" }, t.delete),
              React.createElement("div", { className: "flex gap-2" },
                React.createElement("button", { onClick: () => setEditingProduct(null), className: "px-3 py-1.5 text-xs font-bold text-gray-500" }, t.cancel),
                React.createElement("button", { onClick: () => handleSaveProduct(editingProduct), className: "px-3 py-1.5 bg-blue-600 text-white rounded text-xs font-bold" }, t.save)
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
