<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN HARDWARE - Direct Store Link & Auto Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.3s ease-out forwards; }
    
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-live { animation: pulseLive 1.5s infinite; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-blue-500 selection:text-white">
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    const PRODUCTS = [
      {
        id: 101,
        name: "Intel Core i5-13400F",
        type: "CPU",
        spec: "10 Cores (6P+4E) / 16 Threads / Up to 4.6GHz",
        img: "https://m.media-amazon.com/images/I/51p1IAnuKBL._AC_SL1000_.jpg",
        prices: [
          { store: "Shopee Mall", price: 6590, badge: "ราคาถูกที่สุด", url: "https://shopee.co.th/search?keyword=i5-13400F", trusted: true },
          { store: "JIB Online", price: 6890, badge: "Official Store", url: "https://www.jib.co.th/web/product/readProduct/57224", trusted: true },
          { store: "Lazada LazMall", price: 6700, badge: "Verified", url: "https://www.lazada.co.th/catalog/?q=i5-13400F", trusted: true }
        ]
      },
      {
        id: 102,
        name: "Intel Core i7-14700K",
        type: "CPU",
        spec: "20 Cores (8P+12E) / 28 Threads / Up to 5.6GHz",
        img: "https://m.media-amazon.com/images/I/61S3S68f2SL._AC_SL1000_.jpg",
        prices: [
          { store: "Shopee Mall", price: 16290, badge: "ราคาถูกที่สุด", url: "https://shopee.co.th/search?keyword=i7-14700K", trusted: true },
          { store: "JIB Online", price: 16900, badge: "Official Store", url: "https://www.jib.co.th/web/product/readProduct/62810", trusted: true },
          { store: "Lazada LazMall", price: 16500, badge: "Verified", url: "https://www.lazada.co.th/catalog/?q=i7-14700K", trusted: true }
        ]
      },
      {
        id: 103,
        name: "AMD Ryzen 5 7600X",
        type: "CPU",
        spec: "6 Cores / 12 Threads / Up to 5.3GHz / AM5",
        img: "https://m.media-amazon.com/images/I/5137B3j1SGL._AC_SL1000_.jpg",
        prices: [
          { store: "Shopee Mall", price: 7990, badge: "ราคาถูกที่สุด", url: "https://shopee.co.th/search?keyword=Ryzen+5+7600X", trusted: true },
          { store: "JIB Online", price: 8290, badge: "Official Store", url: "https://www.jib.co.th/web/product/readProduct/55431", trusted: true },
          { store: "Lazada LazMall", price: 8150, badge: "Verified", url: "https://www.lazada.co.th/catalog/?q=Ryzen+5+7600X", trusted: true }
        ]
      },
      {
        id: 104,
        name: "Kingston FURY Beast DDR4 8GB",
        type: "RAM",
        spec: "DDR4 8GB 3200MHz",
        img: "https://m.media-amazon.com/images/I/61N3nIylxKL._AC_SL1000_.jpg",
        prices: [
          { store: "Shopee Mall", price: 1090, badge: "ราคาถูกที่สุด", url: "https://shopee.co.th/search?keyword=Kingston+FURY+Beast+DDR4+8GB", trusted: true },
          { store: "JIB Online", price: 1150, badge: "Official Store", url: "https://www.jib.co.th/web/product/readProduct/48112", trusted: true }
        ]
      },
      {
        id: 105,
        name: "Samsung 990 PRO NVMe 2TB",
        type: "SSD",
        spec: "PCIe 4.0 Read 7450MB/s",
        img: "https://m.media-amazon.com/images/I/71I3uAptInL._AC_SL1500_.jpg",
        prices: [
          { store: "Shopee Mall", price: 6650, badge: "ราคาถูกที่สุด", url: "https://shopee.co.th/search?keyword=Samsung+990+PRO+2TB", trusted: true },
          { store: "JIB Online", price: 6990, badge: "Official Store", url: "https://www.jib.co.th/web/product/readProduct/57820", trusted: true }
        ]
      }
    ];

    function App() {
      const [filter, setFilter] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);

      // ดึงร้านค้าที่ให้ราคาต่ำที่สุด
      const getBestPrice = (prices) => {
        return prices.reduce((min, p) => p.price < min.price ? p : min, prices[0]);
      };

      // เพิ่มลงตะกร้า
      const addToCart = (product) => {
        const best = getBestPrice(product.prices);
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, bestPrice: best, qty: 1 }];
        });
      };

      // ฟังก์ชันกดแล้วเปิดวาร์ปไปหน้าสินค้าในเว็บนั้นๆ ทันที
      const goToStoreDirect = (url) => {
        window.open(url, "_blank", "noopener,noreferrer");
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const filteredProducts = PRODUCTS.filter(p => {
        const matchFilter = filter === "ALL" || p.type === filter;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchFilter && matchSearch;
      });

      const totalCartPrice = cart.reduce((sum, item) => sum + (item.bestPrice.price * item.qty), 0);
      const totalCartItems = cart.reduce((sum, item) => sum + item.qty, 0);

      return React.createElement("div", { className: "min-h-screen bg-slate-900 text-gray-100 p-4 sm:p-6" },
        
        // Header
        React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-slate-800 max-w-5xl mx-auto" },
          React.createElement("div", null,
            React.createElement("h1", { className: "text-2xl font-black bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent" }, "KORN HARDWARE"),
            React.createElement("p", { className: "text-xs text-slate-400" }, "ระบบกดวาร์ปเช็คราคา & Direct Store Redirect")
          ),
          React.createElement("button", {
            onClick: () => setIsCartOpen(true),
            className: "px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-blue-600/20"
          }, `🛒 ตะกร้าสินค้า (${totalCartItems})`)
        ),

        // Main
        React.createElement("main", { className: "max-w-5xl mx-auto mt-6" },
          
          // Filter & Search
          React.createElement("div", { className: "flex flex-col sm:flex-row justify-between items-center gap-4 mb-6" },
            React.createElement("div", { className: "flex gap-2" },
              ["ALL", "CPU", "RAM", "SSD"].map(cat =>
                React.createElement("button", {
                  key: cat,
                  onClick: () => setFilter(cat),
                  className: `px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${filter === cat ? "bg-blue-600 text-white" : "bg-slate-800 text-slate-400 hover:bg-slate-700"}`
                }, cat)
              )
            ),
            React.createElement("input", {
              type: "text",
              placeholder: "ค้นหารุ่นสินค้า...",
              value: searchQuery,
              onChange: (e) => setSearchQuery(e.target.value),
              className: "w-full sm:w-64 px-3.5 py-1.5 text-xs bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white"
            })
          ),

          // Grid
          React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 animate-fade-in" },
            filteredProducts.map(p => {
              const best = getBestPrice(p.prices);
              return React.createElement("div", { key: p.id, className: "bg-slate-800 border border-slate-700/60 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-slate-500 transition-all shadow-xl" },
                React.createElement("div", { className: "w-full h-40 bg-white flex items-center justify-center p-4 relative" },
                  React.createElement("span", { className: "absolute top-2 right-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full" }, best.store),
                  React.createElement("img", { src: p.img, alt: p.name, className: "max-h-full max-w-full object-contain" })
                ),
                React.createElement("div", { className: "p-4 flex-grow flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "text-[10px] font-mono text-blue-400 bg-blue-500/10 border border-blue-500/20 px-2 py-0.5 rounded font-bold" }, p.type),
                    React.createElement("h3", { className: "font-bold text-sm text-white mt-1.5" }, p.name),
                    React.createElement("p", { className: "text-[11px] text-slate-400 mt-1" }, p.spec)
                  ),
                  React.createElement("div", { className: "mt-4 pt-3 border-t border-slate-700/60 space-y-2" },
                    React.createElement("div", { className: "flex justify-between items-end" },
                      React.createElement("div", null,
                        React.createElement("span", { className: "text-[10px] text-slate-400 block" }, "ราคาถูกที่สุดตอนนี้"),
                        React.createElement("span", { className: "font-black text-lg text-emerald-400" }, `฿${best.price.toLocaleString()}`)
                      ),
                      React.createElement("button", {
                        onClick: () => setSelectedProduct(p),
                        className: "text-[11px] text-blue-400 hover:underline font-medium"
                      }, "เช็คทุกร้าน ↗")
                    ),
                    React.createElement("div", { className: "grid grid-cols-2 gap-2 pt-1" },
                      React.createElement("button", {
                        onClick: () => addToCart(p),
                        className: "w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-bold"
                      }, "🛒 +ตะกร้า"),
                      React.createElement("button", {
                        onClick: () => goToStoreDirect(best.url),
                        className: "w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-bold shadow-lg shadow-emerald-600/20"
                      }, "⚡ ซื้อเลย")
                    )
                  )
                )
              );
            })
          )
        ),

        // Modal ตะกร้าสินค้า
        isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: "max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]" },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-slate-700" },
              React.createElement("h2", { className: "text-base font-bold text-white" }, "🛒 ตะกร้าสินค้าของคุณ"),
              React.createElement("button", { onClick: () => setIsCartOpen(false), className: "text-slate-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3" },
              cart.length === 0 ? React.createElement("p", { className: "text-center text-xs text-slate-500 py-8" }, "ไม่มีสินค้าในตะกร้า") :
              cart.map(item => 
                React.createElement("div", { key: item.id, className: "flex items-center justify-between p-3 border border-slate-700 rounded-xl bg-slate-900/50" },
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("img", { src: item.img, alt: item.name, className: "w-10 h-10 object-contain bg-white rounded p-1" }),
                    React.createElement("div", null,
                      React.createElement("p", { className: "font-bold text-xs text-white" }, item.name),
                      React.createElement("p", { className: "text-[10px] text-emerald-400" }, `฿${item.bestPrice.price.toLocaleString()} (${item.bestPrice.store})`),
                      React.createElement("button", {
                        onClick: () => goToStoreDirect(item.bestPrice.url),
                        className: "text-[10px] text-blue-400 hover:underline block mt-0.5"
                      }, "ไปที่หน้าร้านค้า ↗")
                    )
                  ),
                  React.createElement("div", { className: "flex items-center gap-2" },
                    React.createElement("button", { onClick: () => updateQty(item.id, -1), className: "w-6 h-6 border border-slate-600 rounded flex items-center justify-center text-xs font-bold" }, "-"),
                    React.createElement("span", { className: "text-xs font-bold text-white w-4 text-center" }, item.qty),
                    React.createElement("button", { onClick: () => updateQty(item.id, 1), className: "w-6 h-6 border border-slate-600 rounded flex items-center justify-center text-xs font-bold" }, "+")
                  )
                )
              )
            ),
            React.createElement("div", { className: "pt-3 border-t border-slate-700 space-y-3" },
              React.createElement("div", { className: "flex justify-between items-center" },
                React.createElement("span", { className: "text-xs font-bold text-slate-400" }, "ราคารวมโดยประมาณ"),
                React.createElement("span", { className: "text-xl font-black text-emerald-400" }, `฿${totalCartPrice.toLocaleString()}`)
              ),
              React.createElement("p", { className: "text-[10px] text-slate-400 text-center" }, "*การสั่งซื้อจะแยกไปตามหน้าสินค้าของแต่ละร้านค้าโดยตรง"),
              React.createElement("button", {
                onClick: () => setIsCartOpen(false),
                className: "w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-xs font-bold"
              }, "ปิดหน้าต่าง")
            )
          )
        ),

        // Modal เลือกเปิดหน้าร้านค้าแยกตามแพลตฟอร์ม
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: "max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl" },
            React.createElement("div", { className: "bg-white p-4 rounded-xl mb-3 flex items-center justify-center h-32" },
              React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "max-h-full max-w-full object-contain" })
            ),
            React.createElement("h2", { className: "text-sm font-bold text-white" }, selectedProduct.name),
            React.createElement("p", { className: "text-xs text-slate-400 mb-3" }, "เลือกร้านค้าเพื่อเด้งไปยังหน้าสินค้าทันที:"),
            
            React.createElement("div", { className: "space-y-2 mb-4" },
              selectedProduct.prices.map((item, idx) =>
                React.createElement("div", { key: idx, className: "flex justify-between items-center p-3 border border-slate-700 rounded-xl bg-slate-900/50 hover:border-slate-500 transition-all" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "font-bold text-xs text-white block" }, item.store),
                    React.createElement("span", { className: "text-[10px] text-emerald-400 font-medium" }, item.badge)
                  ),
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("span", { className: "font-black text-sm text-emerald-400" }, `฿${item.price.toLocaleString()}`),
                    React.createElement("button", {
                      onClick: () => goToStoreDirect(item.url),
                      className: "bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow"
                    }, "ไปยังสินค้า ↗")
                  )
                )
              )
            ),

            React.createElement("button", {
              onClick: () => setSelectedProduct(null),
              className: "w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-bold"
            }, "ปิดหน้าต่าง")
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
