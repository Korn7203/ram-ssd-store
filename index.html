<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN RAM, SSD & CPU Store (Admin System)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes cartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .animate-cart-pop { animation: cartPop 0.3s ease-in-out; }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }

    @keyframes slideTransition {
      from { opacity: 0; transform: scale(0.97) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .banner-slide-animate {
      animation: slideTransition 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-blue-500 selection:text-white">
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    const ADMIN_USERNAME = "musicnoa7";

    const TEXTS = {
      TH: {
        storeTitle: "KORN PC HARDWARE STORE",
        theme: "โหมด",
        cart: "ตะกร้า",
        login: "เข้าสู่ระบบ",
        logout: "ออกจากระบบ",
        history: "ประวัติการคลิก",
        recent: "ดูล่าสุด",
        all: "ทั้งหมด",
        cpu: "CPU",
        ram: "RAM",
        ssd: "SSD",
        cooler: "ชุดน้ำ",
        cases: "เคสคอม",
        acc: "ตกแต่ง/พัดลม",
        detail: "เปรียบเทียบราคา / ไปหน้าเว็บ",
        cancel: "ยกเลิก",
        addToCart: "ใส่ตะกร้า",
        total: "ราคารวมทั้งหมด",
        clearCart: "ล้างตะกร้าทั้งหมด",
        noHistory: "ยังไม่มีประวัติการคลิกสินค้า",
        noRecent: "ยังไม่มีประวัติการดูสินค้า",
        loginTitle: "เข้าสู่ระบบ",
        usernamePlaceholder: "กรอกชื่อผู้ใช้งาน...",
        close: "ปิด",
        compareTitle: "เปรียบเทียบราคาจากหน้าเว็บจริง",
        adminBtn: "⚙️ จัดการสินค้า (Admin)",
        adminTitle: "ระบบจัดการสินค้า (Admin Dashboard)",
        addProduct: "+ เพิ่มสินค้าใหม่",
        editProduct: "✏️ แก้ไขสินค้า",
        deleteProduct: "🗑️ ลบสินค้า",
        save: "บันทึกข้อมูล",
        resetDefault: "🔄 คืนค่าสินค้าเริ่มต้น"
      },
      EN: {
        storeTitle: "KORN PC HARDWARE STORE",
        theme: "Theme",
        cart: "Cart",
        login: "Login",
        logout: "Logout",
        history: "Click History",
        recent: "Recently Viewed",
        all: "ALL",
        cpu: "CPU",
        ram: "RAM",
        ssd: "SSD",
        cooler: "Coolers",
        cases: "Cases",
        acc: "Decor & Fans",
        detail: "Compare Prices / Open Link",
        cancel: "Cancel",
        addToCart: "Add to Cart",
        total: "Total Price",
        clearCart: "Clear Cart",
        noHistory: "No click history yet",
        noRecent: "No recently viewed items",
        loginTitle: "Sign In",
        usernamePlaceholder: "Enter username...",
        close: "Close",
        compareTitle: "Price Comparison From Live Web",
        adminBtn: "⚙️ Manage Products",
        adminTitle: "Product Management (Admin)",
        addProduct: "+ Add New Product",
        editProduct: "✏️ Edit Product",
        deleteProduct: "🗑️ Delete",
        save: "Save Changes",
        resetDefault: "🔄 Reset Defaults"
      }
    };

    const TECH_NEWS_POOL = [
      {
        id: "news-1",
        title: "🤖 Generative AI On-Device - ชิปเซ็ตประมวลผล AI ในเครื่องไม่ต้องง้อรวดเร็วทันใจ",
        desc: "เทรนด์ CPU ยุคนี้เน้น NPU ประมวลผลโมเดลภาษาขนาดใหญ่ (LLM) บนเครื่องโดยตรง ปลอดภัยและรวดเร็วกว่าเดิม",
        bg: "from-blue-900 via-indigo-900 to-slate-900",
        badge: "WORLD TECH 2026",
        img: "https://assets.brandinside.asia/uploads/2024/07/Chips-AI-Web.png"
      },
      {
        id: "news-2",
        title: "⚡ RAM DDR5 - ยุคใหม่แห่งความเร็วและความจุระดับ 192GB",
        desc: "เทรนด์ RAM มาตรฐานใหม่เน้น Non-Binary RAM ความจุสูงสุด 192GB ความเร็วบัส 8000+ MHz",
        bg: "from-violet-900 via-purple-900 to-slate-900",
        badge: "HARDWARE UPDATE",
        img: "https://notebookspec.com/web/wp-content/uploads/2025/08/2.Pic_Predator-Hera-192GB.png"
      }
    ];

    const DEFAULT_PRODUCTS = [
      { 
        id: 101, name: "Intel Core i5-13400F", type: "CPU", spec: "10 Cores (6P+4E) / 16 Threads / Up to 4.6GHz", 
        img: "https://www.autonetpc.com/wp-content/uploads/2023/01/2022122610011856972_3.webp", desc: "ซีพียูราคาสุดคุ้มสำหรับการเล่นเกมและความบันเทิง", 
        stores: [
          { name: "JIB", price: 5190, url: "https://www.jib.co.th" },
          { name: "Advice", price: 4950, url: "https://www.advice.co.th" },
          { name: "Shopee", price: 6300, url: "https://shopee.co.th" }
        ]
      },
      { 
        id: 1, name: "Kingston FURY Beast", type: "RAM", spec: "DDR4 8GB 3200MHz Black", 
        img: "https://media.kingston.com/kingston/product/FURY_Beast_Black_DDR4_1-zm-lg.jpg", desc: "แรมประสิทธิภาพสูง เสถียรและทนทาน", 
        stores: [
          { name: "JIB", price: 1490, url: "https://www.jib.co.th" },
          { name: "Advice", price: 1450, url: "https://www.advice.co.th" },
          { name: "Shopee", price: 1390, url: "https://shopee.co.th" }
        ]
      }
    ];

    function App() {
      const [lang, setLang] = useState("TH");
      const [theme, setTheme] = useState("light");
      const [user, setUser] = useState(null);
      
      // ดึงข้อมูลสินค้าจาก LocalStorage ถ้าไม่มีให้ใช้ค่าเริ่มต้น
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("korn_store_products");
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [cart, setCart] = useState([]);
      const [filter, setFilter] = useState("ALL");
      const [selectedProduct, setSelectedProduct] = useState(null);
      
      // Modals
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [isRecentOpen, setIsRecentOpen] = useState(false);
      const [isAdminOpen, setIsAdminOpen] = useState(false);

      const [cartAnimate, setCartAnimate] = useState(false);
      const [usernameInput, setUsernameInput] = useState("");
      
      const [orderHistory, setOrderHistory] = useState([]);
      const [recentlyViewed, setRecentlyViewed] = useState([]);
      const [currentNews, setCurrentNews] = useState(TECH_NEWS_POOL[0]);

      // State สำหรับฟอร์มแอดมิน
      const [editingProduct, setEditingProduct] = useState(null);
      const [adminForm, setAdminForm] = useState({
        name: "", type: "CPU", spec: "", img: "", desc: "",
        jibPrice: "", jibUrl: "", advicePrice: "", adviceUrl: "", shopeePrice: "", shopeeUrl: ""
      });

      const t = TEXTS[lang];
      const isAdmin = user === ADMIN_USERNAME;

      // บันทึกสินค้าลง LocalStorage เมื่อมีการเปลี่ยนแปลง
      useEffect(() => {
        localStorage.setItem("korn_store_products", JSON.stringify(products));
      }, [products]);

      const toggleTheme = () => {
        if (theme === "light") setTheme("dark");
        else if (theme === "dark") setTheme("mono");
        else setTheme("light");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (usernameInput.trim()) {
          setUser(usernameInput.trim());
          setIsLoginOpen(false);
          setUsernameInput("");
        }
      };

      const handleLogout = () => {
        setUser(null);
        setIsAdminOpen(false);
      };

      // จัดการฟอร์ม Admin (เปิดหน้าเพิ่ม/แก้ไข)
      const openAdminModal = (productToEdit = null) => {
        if (productToEdit) {
          setEditingProduct(productToEdit);
          const jib = productToEdit.stores.find(s => s.name === "JIB") || {};
          const advice = productToEdit.stores.find(s => s.name === "Advice") || {};
          const shopee = productToEdit.stores.find(s => s.name === "Shopee") || {};

          setAdminForm({
            name: productToEdit.name,
            type: productToEdit.type,
            spec: productToEdit.spec,
            img: productToEdit.img,
            desc: productToEdit.desc || "",
            jibPrice: jib.price || "", jibUrl: jib.url || "",
            advicePrice: advice.price || "", adviceUrl: advice.url || "",
            shopeePrice: shopee.price || "", shopeeUrl: shopee.url || ""
          });
        } else {
          setEditingProduct(null);
          setAdminForm({
            name: "", type: "CPU", spec: "", img: "", desc: "",
            jibPrice: "", jibUrl: "", advicePrice: "", adviceUrl: "", shopeePrice: "", shopeeUrl: ""
          });
        }
        setIsAdminOpen(true);
      };

      // บันทึกการเพิ่ม/แก้ไขสินค้า
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const stores = [
          { name: "JIB", price: Number(adminForm.jibPrice) || 0, url: adminForm.jibUrl || "https://www.jib.co.th" },
          { name: "Advice", price: Number(adminForm.advicePrice) || 0, url: adminForm.adviceUrl || "https://www.advice.co.th" },
          { name: "Shopee", price: Number(adminForm.shopeePrice) || 0, url: adminForm.shopeeUrl || "https://shopee.co.th" }
        ];

        if (editingProduct) {
          // แก้ไข
          const updated = products.map(p => p.id === editingProduct.id ? {
            ...p,
            name: adminForm.name,
            type: adminForm.type,
            spec: adminForm.spec,
            img: adminForm.img,
            desc: adminForm.desc,
            stores
          } : p);
          setProducts(updated);
        } else {
          // เพิ่มใหม่
          const newProd = {
            id: Date.now(),
            name: adminForm.name,
            type: adminForm.type,
            spec: adminForm.spec,
            img: adminForm.img,
            desc: adminForm.desc,
            stores
          };
          setProducts([newProd, ...products]);
        }
        setIsAdminOpen(false);
      };

      // ลบสินค้า
      const handleDeleteProduct = (id) => {
        if (confirm("คุณต้องการลบสินค้านี้ใช่หรือไม่?")) {
          setProducts(products.filter(p => p.id !== id));
          if (selectedProduct?.id === id) setSelectedProduct(null);
        }
      };

      // คืนค่าสินค้าตั้งต้น
      const handleResetDefaults = () => {
        if (confirm("ต้องการคืนค่าสินค้าเริ่มต้นทั้งหมดใช่หรือไม่?")) {
          setProducts(DEFAULT_PRODUCTS);
          localStorage.removeItem("korn_store_products");
        }
      };

      const openDirectLink = (product, store) => {
        const newRecord = {
          id: Date.now(),
          date: new Date().toLocaleString(),
          store: store.name,
          items: [{ name: product.name, price: store.price }],
          total: store.price
        };
        setOrderHistory(prev => [newRecord, ...prev]);
        window.open(store.url, "_blank", "noopener,noreferrer");
      };

      const openProductDetails = (product) => {
        setSelectedProduct(product);
        setRecentlyViewed(prev => {
          const filtered = prev.filter(p => p.id !== product.id);
          return [product, ...filtered];
        });
      };

      const addToCart = (product, store) => {
        setCart([...cart, { ...product, selectedStore: store, cartItemId: Date.now() + Math.random() }]);
        setCartAnimate(true);
        setTimeout(() => setCartAnimate(false), 300);
      };

      const filteredProducts = filter === "ALL" ? products : products.filter(p => p.type === filter);
      const totalPrice = cart.reduce((sum, item) => sum + item.selectedStore.price, 0);

      const getThemeClass = () => {
        if (theme === "dark") return "bg-gray-900 text-white min-h-screen p-4 sm:p-6 transition-colors duration-300";
        if (theme === "mono") return "bg-black text-gray-200 grayscale min-h-screen p-4 sm:p-6 transition-colors duration-300";
        return "bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-6 transition-colors duration-300";
      };

      const cardBgClass = theme === "light" ? "bg-white text-gray-900 border-gray-200" : "bg-gray-800 text-white border-gray-700";

      const getMinPrice = (stores) => {
        const validPrices = stores.map(s => Number(s.price) || Infinity);
        const min = Math.min(...validPrices);
        return min === Infinity ? 0 : min;
      };

      return React.createElement("div", { className: getThemeClass() },
        // Header
        React.createElement("header", { className: "flex flex-col md:flex-row justify-between items-center pb-4 border-b border-gray-300 dark:border-gray-700 max-w-5xl mx-auto gap-4" },
          React.createElement("h1", { className: "text-xl font-extrabold tracking-wider bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent" }, t.storeTitle),
          
          React.createElement("div", { className: "flex flex-wrap gap-2 items-center justify-center" },
            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border rounded-lg text-xs font-bold bg-blue-500/10 text-blue-500"
            }, `🌐 ${lang}`),

            React.createElement("button", {
              onClick: toggleTheme,
              className: "px-2.5 py-1 border rounded-lg text-xs bg-white/10 hover:bg-white/20"
            }, `${t.theme}: ${theme.toUpperCase()}`),

            // แสดงปุ่ม Admin หากลงชื่อเข้าใช้ด้วย musicnoa7
            isAdmin && React.createElement("button", {
              onClick: () => openAdminModal(),
              className: "px-3 py-1 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg text-xs shadow-md animate-pulse"
            }, t.adminBtn),

            user ? 
              React.createElement("div", { className: "flex items-center gap-2 border px-2.5 py-1 rounded-lg text-xs bg-green-500/10 border-green-500/30" },
                React.createElement("span", { className: "font-bold text-green-500" }, `👤 ${user} ${isAdmin ? "(Admin)" : ""}`),
                React.createElement("button", { onClick: handleLogout, className: "text-red-400 hover:underline font-semibold ml-1" }, t.logout)
              )
            :
              React.createElement("button", {
                onClick: () => setIsLoginOpen(true),
                className: "px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold"
              }, `👤 ${t.login}`),

            React.createElement("button", {
              onClick: () => setIsCartOpen(true),
              className: `font-semibold text-xs sm:text-sm flex items-center gap-1.5 bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-md ${cartAnimate ? "animate-cart-pop" : ""}`
            }, `🛒 ${t.cart} (${cart.length})`)
          )
        ),
        
        // Main Content
        React.createElement("main", { className: "max-w-5xl mx-auto mt-6" },
          
          // ปุ่มกรองหมวดหมู่
          React.createElement("div", { className: "flex gap-2 mb-6 overflow-x-auto pb-1" },
            [
              { key: "ALL", label: t.all },
              { key: "CPU", label: t.cpu },
              { key: "RAM", label: t.ram },
              { key: "SSD", label: t.ssd },
              { key: "ชุดน้ำ", label: t.cooler },
              { key: "เคสคอม", label: t.cases },
              { key: "ตกแต่ง/พัดลม", label: t.acc }
            ].map(f =>
              React.createElement("button", {
                key: f.key,
                onClick: () => setFilter(f.key),
                className: `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${filter === f.key ? "bg-blue-600 text-white" : "border border-gray-400"}`
              }, f.label)
            )
          ),
          
          // รายการสินค้า
          React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 animate-fade-in" },
            filteredProducts.map(p => {
              const minPrice = getMinPrice(p.stores);
              return React.createElement("div", { key: p.id, className: `border rounded-xl overflow-hidden flex flex-col justify-between shadow-sm relative group ${cardBgClass}` },
                
                // ปุ่มแก้ไข/ลบ สำหรับ Admin บนการ์ดสินค้า
                isAdmin && React.createElement("div", { className: "absolute top-2 left-2 z-10 flex gap-1" },
                  React.createElement("button", {
                    onClick: () => openAdminModal(p),
                    className: "bg-amber-500 text-black px-2 py-0.5 rounded text-[10px] font-bold shadow"
                  }, "✏️ แก้ไข"),
                  React.createElement("button", {
                    onClick: () => handleDeleteProduct(p.id),
                    className: "bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow"
                  }, "🗑️ ลบ")
                ),

                React.createElement("div", { 
                  onClick: () => openProductDetails(p),
                  className: "w-full h-48 bg-white flex items-center justify-center p-4 cursor-pointer" 
                },
                  React.createElement("img", { src: p.img, alt: p.name, className: "max-h-full max-w-full object-contain" })
                ),
                React.createElement("div", { className: "p-4 flex-grow flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "text-xs border px-2 py-0.5 rounded font-bold" }, p.type),
                    React.createElement("h3", { className: "font-bold text-base mt-2" }, p.name),
                    React.createElement("p", { className: "text-xs opacity-75 mt-1" }, p.spec)
                  ),
                  React.createElement("div", { className: "flex justify-between items-center mt-4 pt-3 border-t border-gray-500/20" },
                    React.createElement("div", null,
                      React.createElement("span", { className: "text-[10px] opacity-60 block" }, "เริ่มต้นที่"),
                      React.createElement("span", { className: "font-bold text-lg text-blue-400" }, `฿${minPrice.toLocaleString()}`)
                    ),
                    React.createElement("button", {
                      onClick: () => openProductDetails(p),
                      className: "bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium"
                    }, t.detail)
                  )
                )
              );
            })
          )
        ),

        // Modal จัดการสินค้า (Admin Dashboard)
        isAdminOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-lg w-full rounded-2xl p-6 shadow-2xl border max-h-[90vh] overflow-y-auto ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold text-amber-500" }, editingProduct ? t.editProduct : t.addProduct),
              React.createElement("button", { onClick: () => setIsAdminOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),

            React.createElement("form", { onSubmit: handleSaveProduct, className: "space-y-3 mt-4 text-xs" },
              React.createElement("div", null,
                React.createElement("label", { className: "font-bold block mb-1" }, "ชื่อสินค้า"),
                React.createElement("input", {
                  type: "text", required: true,
                  value: adminForm.name,
                  onChange: e => setAdminForm({...adminForm, name: e.target.value}),
                  className: "w-full p-2 border rounded-lg bg-transparent"
                })
              ),

              React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                React.createElement("div", null,
                  React.createElement("label", { className: "font-bold block mb-1" }, "หมวดหมู่"),
                  React.createElement("select", {
                    value: adminForm.type,
                    onChange: e => setAdminForm({...adminForm, type: e.target.value}),
                    className: "w-full p-2 border rounded-lg bg-transparent text-gray-900 dark:text-white"
                  },
                    ["CPU", "RAM", "SSD", "ชุดน้ำ", "เคสคอม", "ตกแต่ง/พัดลม"].map(c => 
                      React.createElement("option", { key: c, value: c, className: "text-black" }, c)
                    )
                  )
                ),
                React.createElement("div", null,
                  React.createElement("label", { className: "font-bold block mb-1" }, "สเปกย่อ"),
                  React.createElement("input", {
                    type: "text", required: true,
                    value: adminForm.spec,
                    onChange: e => setAdminForm({...adminForm, spec: e.target.value}),
                    className: "w-full p-2 border rounded-lg bg-transparent"
                  })
                )
              ),

              React.createElement("div", null,
                React.createElement("label", { className: "font-bold block mb-1" }, "ลิงก์รูปภาพ (URL Image)"),
                React.createElement("input", {
                  type: "url", required: true,
                  value: adminForm.img,
                  onChange: e => setAdminForm({...adminForm, img: e.target.value}),
                  className: "w-full p-2 border rounded-lg bg-transparent",
                  placeholder: "https://..."
                })
              ),

              React.createElement("div", { className: "p-3 border border-gray-500/30 rounded-xl space-y-2 bg-gray-500/5" },
                React.createElement("span", { className: "font-bold text-blue-400 block" }, "ร้าน JIB"),
                React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                  React.createElement("input", { type: "number", placeholder: "ราคา (บาท)", value: adminForm.jibPrice, onChange: e => setAdminForm({...adminForm, jibPrice: e.target.value}), className: "p-1.5 border rounded bg-transparent" }),
                  React.createElement("input", { type: "url", placeholder: "ลิงก์หน้าสินค้า JIB", value: adminForm.jibUrl, onChange: e => setAdminForm({...adminForm, jibUrl: e.target.value}), className: "p-1.5 border rounded bg-transparent" })
                ),

                React.createElement("span", { className: "font-bold text-blue-400 block pt-1" }, "ร้าน Advice"),
                React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                  React.createElement("input", { type: "number", placeholder: "ราคา (บาท)", value: adminForm.advicePrice, onChange: e => setAdminForm({...adminForm, advicePrice: e.target.value}), className: "p-1.5 border rounded bg-transparent" }),
                  React.createElement("input", { type: "url", placeholder: "ลิงก์หน้าสินค้า Advice", value: adminForm.adviceUrl, onChange: e => setAdminForm({...adminForm, adviceUrl: e.target.value}), className: "p-1.5 border rounded bg-transparent" })
                ),

                React.createElement("span", { className: "font-bold text-blue-400 block pt-1" }, "ร้าน Shopee"),
                React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                  React.createElement("input", { type: "number", placeholder: "ราคา (บาท)", value: adminForm.shopeePrice, onChange: e => setAdminForm({...adminForm, shopeePrice: e.target.value}), className: "p-1.5 border rounded bg-transparent" }),
                  React.createElement("input", { type: "url", placeholder: "ลิงก์หน้าสินค้า Shopee", value: adminForm.shopeeUrl, onChange: e => setAdminForm({...adminForm, shopeeUrl: e.target.value}), className: "p-1.5 border rounded bg-transparent" })
                )
              ),

              React.createElement("div", { className: "flex justify-between items-center pt-2" },
                React.createElement("button", {
                  type: "button",
                  onClick: handleResetDefaults,
                  className: "text-red-400 hover:underline font-bold text-[11px]"
                }, t.resetDefault),

                React.createElement("div", { className: "flex gap-2" },
                  React.createElement("button", {
                    type: "button",
                    onClick: () => setIsAdminOpen(false),
                    className: "px-3 py-1.5 border rounded-lg"
                  }, t.cancel),
                  React.createElement("button", {
                    type: "submit",
                    className: "px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg shadow"
                  }, t.save)
                )
              )
            )
          )
        ),

        // Modal ล็อกอิน
        isLoginOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("form", { onSubmit: handleLogin, className: `max-w-xs w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("h2", { className: "text-lg font-bold mb-4" }, t.loginTitle),
            React.createElement("input", {
              type: "text",
              required: true,
              placeholder: t.usernamePlaceholder,
              value: usernameInput,
              onChange: (e) => setUsernameInput(e.target.value),
              className: "w-full p-2.5 border rounded-xl mb-4 bg-transparent text-sm focus:outline-none focus:border-blue-500"
            }),
            React.createElement("p", { className: "text-[11px] opacity-60 mb-4" }, "💡 เข้าสู่ระบบด้วยชื่อบัญชี <b>musicnoa7</b> เพื่อเข้าถึงโหมด Admin"),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", {
                type: "button",
                onClick: () => setIsLoginOpen(false),
                className: "px-3 py-1.5 border rounded-xl text-xs font-semibold"
              }, t.cancel),
              React.createElement("button", {
                type: "submit",
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold"
              }, t.login)
            )
          )
        ),

        // Modal รายละเอียดสินค้า
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("div", { className: "bg-white p-4 rounded-xl mb-4 flex items-center justify-center h-40 shadow-inner" },
              React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "max-h-full max-w-full object-contain" })
            ),
            React.createElement("h2", { className: "text-xl font-bold" }, selectedProduct.name),
            React.createElement("p", { className: "text-xs opacity-70 mt-1 mb-3" }, selectedProduct.spec),

            React.createElement("div", { className: "my-3 pt-3 border-t border-gray-500/30 space-y-2" },
              selectedProduct.stores.map((st, i) =>
                React.createElement("div", { key: i, className: "flex items-center justify-between p-2.5 rounded-xl border border-gray-500/20 bg-gray-500/5" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "font-bold text-xs block" }, st.name),
                    React.createElement("span", { className: "text-sm font-extrabold text-blue-400" }, `฿${st.price.toLocaleString()}`)
                  ),
                  React.createElement("button", {
                    onClick: () => openDirectLink(selectedProduct, st),
                    className: "px-3 py-1 bg-orange-500 text-white rounded-lg text-xs font-bold"
                  }, "ไปหน้าร้าน ↗")
                )
              )
            ),
            
            React.createElement("button", {
              onClick: () => setSelectedProduct(null),
              className: "w-full mt-3 py-2 border border-gray-500/40 text-gray-400 rounded-xl text-xs font-semibold"
            }, t.close)
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
