<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN RAM & SSD Store - Auth System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-950 text-white selection:bg-blue-500 selection:text-white min-h-screen">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    const TEXTS = {
      TH: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "เข้าสู่ระบบ",
        register: "สมัครสมาชิก",
        logout: "ออกจากระบบ",
        email: "อีเมล",
        password: "รหัสผ่าน",
        confirmPassword: "ยืนยันรหัสผ่าน",
        verifyNotice: "กรุณาตรวจสอบอีเมลของคุณเพื่อยืนยันบัญชีก่อนใช้งาน",
        resendEmail: "ส่งอีเมลยืนยันอีกครั้ง",
        emailVerified: "ยืนยันอีเมลแล้ว",
        emailNotVerified: "ยังไม่ได้ยืนยันอีเมล",
        loginError: "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
        registerSuccess: "สมัครสมาชิกสำเร็จ! ระบบได้ส่งลิงก์ยืนยันไปยังอีเมลของคุณแล้ว (โปรดตรวจสอบข้อความแจ้งเตือน)",
        passwordMismatch: "รหัสผ่านไม่ตรงกัน",
        passwordTooShort: "รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร",
        emailInUse: "อีเมลนี้ถูกใช้งานในระบบแล้ว",
        close: "ปิด",
        verifySimulated: "ส่งอีเมลยืนยันสำเร็จ! (จำลองการส่งไปยัง ",
        welcome: "ยินดีต้อนรับสู่ KORN RAM & SSD Store",
        descUser: "คุณเข้าสู่ระบบในชื่อ: ",
        descGuest: "กรุณาเข้าสู่ระบบเพื่อใช้งานเต็มรูปแบบ"
      },
      EN: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "Login",
        register: "Register",
        logout: "Logout",
        email: "Email",
        password: "Password",
        confirmPassword: "Confirm Password",
        verifyNotice: "Please check your email to verify your account.",
        resendEmail: "Resend Verification Email",
        emailVerified: "Email Verified",
        emailNotVerified: "Email Not Verified",
        loginError: "Invalid email or password",
        registerSuccess: "Registration successful! Verification email sent.",
        passwordMismatch: "Passwords do not match",
        passwordTooShort: "Password must be at least 6 characters",
        emailInUse: "Email is already registered",
        close: "Close",
        verifySimulated: "Verification email sent to ",
        welcome: "Welcome to KORN RAM & SSD Store",
        descUser: "Logged in as: ",
        descGuest: "Please login to access all features"
      }
    };

    // Helper ในการเก็บข้อมูลผู้ใช้ไว้ใน LocalStorage เพื่อให้ทดสอบได้ทันที
    const getUsers = () => JSON.parse(localStorage.getItem("app_users") || "[]");
    const saveUsers = (users) => localStorage.setItem("app_users", JSON.stringify(users));
    const getCurrentUser = () => JSON.parse(localStorage.getItem("app_current_user") || "null");
    const setCurrentUser = (user) => localStorage.setItem("app_current_user", JSON.stringify(user));

    function App() {
      const [lang, setLang] = useState("TH");
      const [user, setUser] = useState(getCurrentUser());
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login");

      // Form States
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [errorMessage, setErrorMessage] = useState("");
      const [successMessage, setSuccessMessage] = useState("");
      const [loading, setLoading] = useState(false);

      const t = TEXTS[lang];

      // จัดการล็อกอิน
      const handleLogin = (e) => {
        e.preventDefault();
        setErrorMessage("");
        setSuccessMessage("");
        setLoading(true);

        setTimeout(() => {
          const users = getUsers();
          const foundUser = users.find(u => u.email.toLowerCase() === email.toLowerCase());

          if (!foundUser || foundUser.password !== password) {
            setErrorMessage(t.loginError);
            setLoading(false);
            return;
          }

          setCurrentUser(foundUser);
          setUser(foundUser);
          setIsAuthOpen(false);
          resetForm();
          setLoading(false);
        }, 500);
      };

      // จัดการสมัครสมาชิก + ตรวจรหัสผ่าน + ส่งอีเมลยืนยัน
      const handleRegister = (e) => {
        e.preventDefault();
        setErrorMessage("");
        setSuccessMessage("");

        if (password !== confirmPassword) {
          setErrorMessage(t.passwordMismatch);
          return;
        }

        if (password.length < 6) {
          setErrorMessage(t.passwordTooShort);
          return;
        }

        setLoading(true);

        setTimeout(() => {
          const users = getUsers();
          if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
            setErrorMessage(t.emailInUse);
            setLoading(false);
            return;
          }

          const newUser = {
            id: Date.now(),
            email: email.trim(),
            password: password,
            emailVerified: false
          };

          users.push(newUser);
          saveUsers(users);

          setSuccessMessage(t.registerSuccess);
          
          // จำลองการส่งอีเมลยืนยันตัวตน
          alert(`📧 [ระบบจำลองการส่งอีเมล]\n\nเราได้ส่งอีเมลยืนยันไปยัง: ${email}\nกรุณากดยืนยันเพื่อเริ่มใช้งาน`);

          setTimeout(() => {
            setAuthMode("login");
            resetForm();
          }, 2000);

          setLoading(false);
        }, 500);
      };

      // จำลองการยืนยันอีเมล
      const handleVerifyEmail = () => {
        if (!user) return;
        const users = getUsers();
        const updatedUsers = users.map(u => u.email === user.email ? { ...u, emailVerified: true } : u);
        saveUsers(updatedUsers);

        const updatedUser = { ...user, emailVerified: true };
        setCurrentUser(updatedUser);
        setUser(updatedUser);
        alert("✅ ยืนยันอีเมลเรียบร้อยแล้ว!");
      };

      // ส่งอีเมลยืนยันซ้ำ
      const handleResendVerification = () => {
        alert(`📧 ส่งอีเมลยืนยันอีกครั้งไปยัง ${user.email} เรียบร้อยแล้ว!`);
      };

      const handleLogout = () => {
        localStorage.removeItem("app_current_user");
        setUser(null);
      };

      const resetForm = () => {
        setEmail("");
        setPassword("");
        setConfirmPassword("");
        setErrorMessage("");
        setSuccessMessage("");
      };

      return React.createElement("div", { className: "p-4 max-w-5xl mx-auto font-sans" },
        // Header
        React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-gray-800" },
          React.createElement("h1", { className: "text-xl font-bold text-blue-400 tracking-wide" }, t.storeTitle),
          
          React.createElement("div", { className: "flex items-center gap-3" },
            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border border-gray-800 rounded-lg text-xs hover:bg-gray-900 transition-all"
            }, `🌐 ${lang}`),

            user ? 
              React.createElement("div", { className: "flex items-center gap-3" },
                React.createElement("div", { className: "text-right" },
                  React.createElement("div", { className: "text-xs font-bold text-green-400" }, user.email),
                  React.createElement("div", { className: `text-[10px] ${user.emailVerified ? "text-blue-400" : "text-yellow-400"}` },
                    user.emailVerified ? `✓ ${t.emailVerified}` : `⚠️ ${t.emailNotVerified}`
                  )
                ),
                React.createElement("button", {
                  onClick: handleLogout,
                  className: "px-3 py-1.5 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-bold hover:bg-red-600/40 transition-all"
                }, t.logout)
              )
            :
              React.createElement("button", {
                onClick: () => { setAuthMode("login"); setIsAuthOpen(true); },
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/20"
              }, `👤 ${t.login}`)
          )
        ),

        // แถบแจ้งเตือนกรณียังไม่ได้ยืนยันอีเมล
        user && !user.emailVerified && React.createElement("div", { className: "mt-4 p-4 bg-yellow-500/10 border border-yellow-500/30 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 text-xs text-yellow-300 animate-fade-in" },
          React.createElement("div", { className: "flex items-center gap-2" },
            React.createElement("span", { className: "text-base" }, "⚠️"),
            React.createElement("span", null, t.verifyNotice)
          ),
          React.createElement("div", { className: "flex items-center gap-2" },
            React.createElement("button", {
              onClick: handleResendVerification,
              className: "px-3 py-1.5 bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 font-bold rounded-xl hover:bg-yellow-500/30 transition-all"
            }, t.resendEmail),
            React.createElement("button", {
              onClick: handleVerifyEmail,
              className: "px-3 py-1.5 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition-all"
            }, "กดเพื่อยืนยันอีเมล (จำลอง)")
          )
        ),

        // เนื้อหาหลัก
        React.createElement("main", { className: "mt-8 text-center py-20 text-gray-400 border border-dashed border-gray-800 rounded-3xl bg-gray-900/30" },
          React.createElement("h2", { className: "text-xl font-bold text-white mb-2" }, t.welcome),
          React.createElement("p", { className: "text-sm text-gray-400" }, 
            user ? `${t.descUser}${user.email}` : t.descGuest
          )
        ),

        // Modal ล็อกอิน / สมัครสมาชิก
        isAuthOpen && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in" },
          React.createElement("div", { className: "max-w-sm w-full bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl relative" },
            
            // ปุ่มปิด
            React.createElement("button", {
              onClick: () => { setIsAuthOpen(false); resetForm(); },
              className: "absolute top-4 right-4 text-gray-500 hover:text-white text-lg transition-all"
            }, "✕"),

            // แท็บเลือก Login / Register
            React.createElement("div", { className: "flex border-b border-gray-800 mb-6" },
              React.createElement("button", {
                onClick: () => { setAuthMode("login"); resetForm(); },
                className: `flex-1 pb-3 text-sm font-bold transition-all ${authMode === "login" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-500 hover:text-gray-300"}`
              }, t.login),
              React.createElement("button", {
                onClick: () => { setAuthMode("register"); resetForm(); },
                className: `flex-1 pb-3 text-sm font-bold transition-all ${authMode === "register" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-500 hover:text-gray-300"}`
              }, t.register)
            ),

            // ข้อความแจ้งเตือนข้อผิดพลาด / สำเร็จ
            errorMessage && React.createElement("div", { className: "mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs animate-fade-in" }, errorMessage),
            successMessage && React.createElement("div", { className: "mb-4 p-3 bg-green-500/10 border border-green-500/30 text-green-400 rounded-xl text-xs animate-fade-in" }, successMessage),

            // ฟอร์ม
            React.createElement("form", { onSubmit: authMode === "login" ? handleLogin : handleRegister, className: "space-y-4" },
              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.email),
                React.createElement("input", {
                  type: "email",
                  required: true,
                  placeholder: "example@email.com",
                  value: email,
                  onChange: (e) => setEmail(e.target.value),
                  className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white transition-all"
                })
              ),

              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.password),
                React.createElement("input", {
                  type: "password",
                  required: true,
                  placeholder: "••••••••",
                  value: password,
                  onChange: (e) => setPassword(e.target.value),
                  className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white transition-all"
                })
              ),

              authMode === "register" && React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.confirmPassword),
                React.createElement("input", {
                  type: "password",
                  required: true,
                  placeholder: "••••••••",
                  value: confirmPassword,
                  onChange: (e) => setConfirmPassword(e.target.value),
                  className: "w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white transition-all"
                })
              ),

              React.createElement("button", {
                type: "submit",
                disabled: loading,
                className: "w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-all disabled:opacity-50 mt-2 shadow-lg shadow-blue-600/20"
              }, loading ? "กำลังดำเนินการ..." : (authMode === "login" ? t.login : t.register))
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
