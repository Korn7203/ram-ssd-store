                    React.createElement("button", {
                      onClick: () => openProductDetails(p),
                      className: "bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-md shadow-blue-600/20"
                    }, t.compareBtn)
                  )
                )
              );
            })
          )
        ),

        // Modal เปรียบเทียบราคาจากทุกร้านค้า (Affiliate Links)
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("div", { className: "bg-white p-4 rounded-xl mb-4 flex items-center justify-center h-44 shadow-inner relative" },
              React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "max-h-full max-w-full object-contain" })
            ),
            React.createElement("div", { className: "flex justify-between items-center mb-1" },
              React.createElement("span", { className: "text-xs border px-2 py-0.5 rounded font-mono font-bold" }, selectedProduct.type),
              React.createElement("span", { className: "text-xs text-blue-400 font-bold" }, "🔄 อัปเดตราคาแบบเรียลไทม์")
            ),
            React.createElement("h2", { className: "text-lg font-bold mt-1" }, selectedProduct.name),
            React.createElement("p", { className: "text-xs font-semibold opacity-80 mt-0.5" }, selectedProduct.spec),
            React.createElement("p", { className: "text-xs opacity-70 mt-2 mb-4 leading-relaxed" }, selectedProduct.desc),
            
            // รายการเปรียบเทียบราคาแต่ละร้านค้า
            React.createElement("div", { className: "space-y-2 mb-4" },
              React.createElement("p", { className: "text-xs font-bold opacity-80 mb-1" }, "🏷️ เปรียบเทียบราคาจากร้านค้าที่น่าเชื่อถือ:"),
              selectedProduct.prices.map((item, idx) =>
                React.createElement("div", { key: idx, className: "flex justify-between items-center p-2.5 border border-gray-500/20 rounded-xl bg-gray-500/5" },
                  React.createElement("div", null,
                    React.createElement("span", { className: "font-bold text-xs block" }, item.store),
                    React.createElement("span", { className: "text-[10px] text-green-400 font-medium" }, item.badge)
                  ),
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("span", { className: "font-black text-sm text-blue-400" }, `฿${item.price.toLocaleString()}`),
                    React.createElement("a", {
                      href: item.url,
                      target: "_blank",
                      rel: "noopener noreferrer",
                      className: "bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition-all shadow"
                    }, `${t.goToStore} ↗`)
                  )
                )
              )
            ),

            React.createElement("div", { className: "flex justify-end pt-2 border-t border-gray-500/20" },
              React.createElement("button", {
                onClick: () => setSelectedProduct(null),
                className: "px-4 py-1.5 border border-gray-500/50 rounded-xl text-xs font-semibold hover:bg-gray-500/20 active:scale-95 transition-all"
              }, t.close)
            )
          )
        ),

        // Modal ประวัติการเช็คราคาล่าสุด
        isRecentOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `👁️ ${t.recent}`),
              React.createElement("button", { onClick: () => setIsRecentOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-2" },
              recentlyViewed.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noRecent)
              :
                recentlyViewed.map(item => {
                  const best = getBestPrice(item.prices);
                  return React.createElement("div", {
                    key: item.id,
                    onClick: () => {
                      setIsRecentOpen(false);
                      openProductDetails(item);
                    },
                    className: "flex items-center gap-3 p-2 border border-gray-500/20 rounded-xl bg-gray-500/5 hover:bg-gray-500/10 cursor-pointer transition-all"
                  },
                    React.createElement("img", { src: item.img, alt: item.name, className: "w-10 h-10 object-contain bg-white rounded p-1" }),
                    React.createElement("div", { className: "flex-grow min-w-0" },
                      React.createElement("p", { className: "font-bold text-xs truncate" }, item.name),
                      React.createElement("p", { className: "text-xs text-blue-400" }, `เริ่ม ฿${best.price.toLocaleString()} (${best.store})`)
                    )
                  );
                })
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
