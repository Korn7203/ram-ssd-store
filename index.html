  <style>
    @keyframes cartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .animate-cart-pop { animation: cartPop 0.3s ease-in-out; }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }
  </style>
</head>

      // --- RAM ---
      { id: 1, name: "Kingston FURY Beast", type: "RAM", spec: "DDR4 8GB 3200MHz", price: 1150, stock: 999, img: "https://notebookspec.com/storage/pc-ram/ram_1242_20211004-174841_5.png", desc: "แรมประสิทธิภาพสูงสำหรับการเล่นเกมและการทำงานทั่วไป", storeName: "Shopee", shopUrl: "https://shopee.co.th/search?keyword=Kingston%20FURY%20Beast%20DDR4%208GB" },

      { id: 3, name: "Kingston FURY Renegade", type: "RAM", spec: "DDR5 64GB 6400MHz", price: 8900, stock: 999, img: "https://notebookspec.com/storage/pc-ram/ram_1242_20211004-174841_5.png", desc: "ความจุจัดเต็ม 64GB ตอบโจทย์สายโอเวอร์คล็อกและการประมวลผลหนัก", storeName: "Lazada", shopUrl: "https://www.lazada.co.th/tag/kingston-fury-renegade-ddr5-64gb/" },

      // --- SSD ---
      { id: 4, name: "Samsung 990 PRO", type: "SSD", spec: "2TB Read 7450MB/s", price: 6990, stock: 999, img: "https://www.jib.co.th/img_master/product/original/2023082416295161614_1.jpg", desc: "SSD NVMe Gen4 ที่เร็วที่สุดจาก Samsung โหลดเกมและไฟล์ขนาดใหญ่ได้เร็วมาก", storeName: "Shopee", shopUrl: "https://shopee.co.th/search?keyword=Samsung%20990%20PRO%202TB" },
      { id: 5, name: "WD Black SN850X", type: "SSD", spec: "4TB Read 7300MB/s", price: 14500, stock: 999, img: "https://www.jib.co.th/img_master/product/original/2023120415101463977_1.jpg", desc: "ความจุระดับพรีเมียม 4TB มาพร้อม Game Mode 2.0", storeName: "Advice", shopUrl: "https://www.advice.co.th/product/solid-state-drive-ssd-" },
      { id: 6, name: "Crucial P3 Plus", type: "SSD", spec: "1TB Read 5000MB/s", price: 2690, stock: 999, img: "https://www.jib.co.th/img_master/product/original/2023082211134861550_1.jpg", desc: "SSD NVMe Gen4 ราคาสบายกระเป๋า คุ้มค่าที่สุดสำหรับการอัปเกรด", storeName: "Shopee", shopUrl: "https://shopee.co.th/search?keyword=Crucial%20P3%20Plus%201TB" },

      // --- ชุดน้ำ ---
      { id: 7, name: "NZXT Kraken 240 RGB", type: "ชุดน้ำ", spec: "Liquid Cooler 240mm", price: 4990, stock: 50, img: "https://www.jib.co.th/img_master/product/original/2023090813340061967_1.jpg", desc: "ชุดน้ำปิด 240 มม. ดีไซน์พรีเมียมพร้อมไฟ RGB สวยงาม", storeName: "JIB", shopUrl: "https://www.jib.co.th/web/product/readProduct/60000" },
      { id: 8, name: "Corsair iCUE H150i ELITE", type: "ชุดน้ำ", spec: "Liquid Cooler 360mm", price: 6590, stock: 30, img: "https://www.jib.co.th/img_master/product/original/2023021710432757949_1.png", desc: "ชุดน้ำปิดหม้อน้ำ 360 มม. จัดเต็ม 3 พัดลมระบายความร้อนขั้นสุดยอด", storeName: "Shopee", shopUrl: "https://shopee.co.th/search?keyword=Corsair%20iCUE%20H150i" }
    ];

    function App() {
      const [lang, setLang] = useState("TH");
      const [theme, setTheme] = useState("light");
      const [user, setUser] = useState(null);
      const [cart, setCart] = useState([]);
      const [filter, setFilter] = useState("ALL");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [isRecentOpen, setIsRecentOpen] = useState(false);
      const [cartAnimate, setCartAnimate] = useState(false);
      const [usernameInput, setUsernameInput] = useState("");
      
      const [orderHistory, setOrderHistory] = useState([]);
      const [recentlyViewed, setRecentlyViewed] = useState([]);

      const t = TEXTS[lang];

      const toggleTheme = () => {
        if (theme === "light") setTheme("dark");
        else if (theme === "dark") setTheme("mono");
        else setTheme("light");
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (usernameInput.trim()) {
          setUser(usernameInput.trim());
          setIsLoginOpen(false);
          setUsernameInput("");
        }
      };

      const handleLogout = () => {
        setUser(null);
      };

      const openProductDetails = (product) => {
        setSelectedProduct(product);
        setRecentlyViewed(prev => {
          const filtered = prev.filter(p => p.id !== product.id);
          return [product, ...filtered];
        });
      };

      const addToCart = (product) => {
        setCart([...cart, { ...product, cartItemId: Date.now() + Math.random() }]);
        setCartAnimate(true);
        setTimeout(() => setCartAnimate(false), 300);
      };

      const removeFromCart = (cartItemId) => {
        setCart(cart.filter(item => item.cartItemId !== cartItemId));
      };

      const checkoutStore = (storeName, storeUrl) => {
        const storeItems = cart.filter(item => item.storeName === storeName);
        if (storeItems.length > 0) {
          const newOrder = {
            id: Date.now(),
            date: new Date().toLocaleString(),
            store: storeName,
            items: storeItems,
            total: storeItems.reduce((s, i) => s + i.price, 0)
          };
          setOrderHistory([newOrder, ...orderHistory]);
          setCart(cart.filter(item => item.storeName !== storeName));
          window.open(storeUrl, "_blank");
        }
      };

      const filteredProducts = filter === "ALL" ? PRODUCTS : PRODUCTS.filter(p => p.type === filter);
      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      const uniqueStores = Array.from(
        new Map(cart.map(item => [item.storeName, { name: item.storeName, url: item.shopUrl }])).values()
      );

      const getThemeClass = () => {
        if (theme === "dark") return "bg-gray-900 text-white min-h-screen p-4 sm:p-6 transition-colors duration-300";
        if (theme === "mono") return "bg-black text-gray-200 grayscale min-h-screen p-4 sm:p-6 transition-colors duration-300";
        return "bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-6 transition-colors duration-300";
      };

      const cardBgClass = theme === "light" 
        ? "bg-white text-gray-900 border-gray-200" 
        : "bg-gray-800 text-white border-gray-700";

      return React.createElement("div", { className: getThemeClass() },
        // Header
        React.createElement("header", { className: "flex flex-col md:flex-row justify-between items-center pb-4 border-b border-gray-300 dark:border-gray-700 max-w-5xl mx-auto gap-4" },
          React.createElement("h1", { className: "text-xl font-extrabold tracking-wider bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent" }, t.storeTitle),
          
          React.createElement("div", { className: "flex flex-wrap gap-2 items-center justify-center" },
            // สลับภาษา
            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border rounded-lg text-xs font-bold bg-blue-500/10 hover:bg-blue-500/20 active:scale-95 transition-all text-blue-500"
            }, `🌐 ${lang}`),

            // เปลี่ยนธีม
            React.createElement("button", {
              onClick: toggleTheme,
              className: "px-2.5 py-1 border rounded-lg text-xs bg-white/10 hover:bg-white/20 active:scale-95 transition-all"
            }, `${t.theme}: ${theme.toUpperCase()}`),

            // ประวัติการดู
            React.createElement("button", {
              onClick: () => setIsRecentOpen(true),
              className: "px-2.5 py-1 border rounded-lg text-xs hover:bg-gray-500/10 active:scale-95 transition-all"
            }, `👁️ ${t.recent} (${recentlyViewed.length})`),

            // ประวัติการซื้อ
            React.createElement("button", {
              onClick: () => setIsHistoryOpen(true),
              className: "px-2.5 py-1 border rounded-lg text-xs hover:bg-gray-500/10 active:scale-95 transition-all"
            }, `📜 ${t.history}`),

            // ปุ่มล็อกอิน / ผู้ใช้
            user ? 
              React.createElement("div", { className: "flex items-center gap-2 border px-2.5 py-1 rounded-lg text-xs bg-green-500/10 border-green-500/30" },
                React.createElement("span", { className: "font-bold text-green-500" }, `👤 ${user}`),
                React.createElement("button", { onClick: handleLogout, className: "text-red-400 hover:underline font-semibold ml-1" }, t.logout)
              )
            :
              React.createElement("button", {
                onClick: () => setIsLoginOpen(true),
                className: "px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold active:scale-95 transition-all"
              }, `👤 ${t.login}`),

            // ตะกร้า
            React.createElement("button", {
              onClick: () => setIsCartOpen(true),
              className: `font-semibold text-xs sm:text-sm flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg active:scale-95 transition-all shadow-md shadow-blue-600/30 ${cartAnimate ? "animate-cart-pop" : ""}`
            },
              React.createElement("span", null, "🛒"),
              React.createElement("span", null, `${t.cart} (${cart.length})`)
            )
          )
        ),
        
        // Main Content
        React.createElement("main", { className: "max-w-5xl mx-auto mt-6" },
          React.createElement("div", { className: "flex gap-2 mb-6 overflow-x-auto pb-1" },
            [
              { key: "ALL", label: t.all },
              { key: "CPU", label: t.cpu },
              { key: "RAM", label: t.ram },
              { key: "SSD", label: t.ssd },
              { key: "ชุดน้ำ", label: t.cooler }
            ].map(f =>
              React.createElement("button", {
                key: f.key,
                onClick: () => setFilter(f.key),
                className: `px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 active:scale-95 ${filter === f.key ? "bg-blue-600 text-white shadow-md shadow-blue-500/30" : "border border-gray-400 hover:bg-gray-500/20"}`
              }, f.label)
            )
          ),
          
          React.createElement("div", { key: filter, className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 animate-fade-in" },
            filteredProducts.map(p =>
              React.createElement("div", { key: p.id, className: `border rounded-xl overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 ${cardBgClass}` },
                React.createElement("div", { className: "w-full h-48 bg-white flex items-center justify-center p-4 overflow-hidden group" },
                  React.createElement("img", { src: p.img, alt: p.name, className: "max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300" })
                ),
                React.createElement("div", { className: "p-4 flex-grow flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("div", { className: "flex justify-between items-center mb-2" },
                      React.createElement("span", { className: "text-xs border px-2 py-0.5 rounded-md font-mono font-bold opacity-80" }, p.type),
                      React.createElement("span", { className: "text-xs text-green-400 font-semibold bg-green-950/40 px-2 py-0.5 rounded-full" }, `${t.stock}: ${p.stock}`)
                    ),
                    React.createElement("h3", { className: "font-bold text-base mt-1" }, p.name),
                    React.createElement("p", { className: "text-xs opacity-75 mt-0.5" }, p.spec)
                  ),
                  React.createElement("div", { className: "flex justify-between items-center mt-4 pt-3 border-t border-gray-500/20" },
                    React.createElement("span", { className: "font-bold text-lg text-blue-400" }, `฿${p.price.toLocaleString()}`),
                    React.createElement("button", {
                      onClick: () => openProductDetails(p),
                      className: "bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-md shadow-blue-600/20"
                    }, t.detail)
                  )
                )
              )
            )
          )
        ),

        // 👤 Modal ล็อกอิน
        isLoginOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("form", { onSubmit: handleLogin, className: `max-w-xs w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("h2", { className: "text-lg font-bold mb-4" }, t.loginTitle),
            React.createElement("input", {
              type: "text",
              required: true,
              placeholder: t.usernamePlaceholder,
              value: usernameInput,
              onChange: (e) => setUsernameInput(e.target.value),
              className: "w-full p-2.5 border rounded-xl mb-4 bg-transparent text-sm focus:outline-none focus:border-blue-500"
            }),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", {
                type: "button",
                onClick: () => setIsLoginOpen(false),
                className: "px-3 py-1.5 border rounded-xl text-xs font-semibold"
              }, t.cancel),
              React.createElement("button", {
                type: "submit",
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold"
              }, t.login)
            )
          )
        ),

        // 📜 Modal ประวัติการซื้อ
        isHistoryOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `📜 ${t.history}`),
              React.createElement("button", { onClick: () => setIsHistoryOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3" },
              orderHistory.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noHistory)
              :
                orderHistory.map(order =>
                  React.createElement("div", { key: order.id, className: "p-3 border border-gray-500/20 rounded-xl bg-gray-500/5 text-xs" },
                    React.createElement("div", { className: "flex justify-between text-gray-400 mb-1" },
                      React.createElement("span", null, order.date),
                      React.createElement("span", { className: "font-bold text-orange-400" }, order.store)
                    ),
                    order.items.map((item, idx) =>
                      React.createElement("div", { key: idx, className: "flex justify-between py-1" },
                        React.createElement("span", null, item.name),
                        React.createElement("span", { className: "font-semibold" }, `฿${item.price.toLocaleString()}`)
                      )
                    ),
                    React.createElement("div", { className: "text-right font-bold text-blue-400 mt-2 pt-1 border-t border-gray-500/20" },
                      `${t.total}: ฿${order.total.toLocaleString()}`
                    )
                  )
                )
            )
          )
        ),

        // 👁️ Modal ประวัติการดูสินค้าล่าสุด
        isRecentOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `👁️ ${t.recent}`),
              React.createElement("button", { onClick: () => setIsRecentOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-2" },
              recentlyViewed.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noRecent)
              :
                recentlyViewed.map(item =>
                  React.createElement("div", {
                    key: item.id,
                    onClick: () => {
                      setIsRecentOpen(false);
                      openProductDetails(item);
                    },
                    className: "flex items-center gap-3 p-2 border border-gray-500/20 rounded-xl bg-gray-500/5 hover:bg-gray-500/10 cursor-pointer transition-all"
                  },

              }, `👤 ${t.login}`),

            // ตะกร้า
            React.createElement("button", {
              onClick: () => setIsCartOpen(true),
              className: `font-semibold text-xs sm:text-sm flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg active:scale-95 transition-all shadow-md shadow-blue-600/30 ${cartAnimate ? "animate-cart-pop" : ""}`
            },
              React.createElement("span", null, "🛒"),
              React.createElement("span", null, `${t.cart} (${cart.length})`)
            )
          )
        ),
        
        // Main Content
        React.createElement("main", { className: "max-w-5xl mx-auto mt-6" },
          React.createElement("div", { className: "flex gap-2 mb-6 overflow-x-auto pb-1" },
            [
              { key: "ALL", label: t.all },
              { key: "CPU", label: t.cpu },
              { key: "RAM", label: t.ram },
              { key: "SSD", label: t.ssd },
              { key: "ชุดน้ำ", label: t.cooler }
            ].map(f =>
              React.createElement("button", {
                key: f.key,
                onClick: () => setFilter(f.key),
                className: `px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 active:scale-95 ${filter === f.key ? "bg-blue-600 text-white shadow-md shadow-blue-500/30" : "border border-gray-400 hover:bg-gray-500/20"}`
              }, f.label)
            )
          ),
          
          React.createElement("div", { key: filter, className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 animate-fade-in" },
            filteredProducts.map(p =>
              React.createElement("div", { key: p.id, className: `border rounded-xl overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 ${cardBgClass}` },
                React.createElement("div", { className: "w-full h-48 bg-white flex items-center justify-center p-4 overflow-hidden group" },
                  React.createElement("img", { src: p.img, alt: p.name, className: "max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300" })
                ),
                React.createElement("div", { className: "p-4 flex-grow flex flex-col justify-between" },
                  React.createElement("div", null,
                    React.createElement("div", { className: "flex justify-between items-center mb-2" },
                      React.createElement("span", { className: "text-xs border px-2 py-0.5 rounded-md font-mono font-bold opacity-80" }, p.type),
                      React.createElement("span", { className: "text-xs text-green-400 font-semibold bg-green-950/40 px-2 py-0.5 rounded-full" }, `${t.stock}: ${p.stock}`)
                    ),
                    React.createElement("h3", { className: "font-bold text-base mt-1" }, p.name),
                    React.createElement("p", { className: "text-xs opacity-75 mt-0.5" }, p.spec)
                  ),
                  React.createElement("div", { className: "flex justify-between items-center mt-4 pt-3 border-t border-gray-500/20" },
                    React.createElement("span", { className: "font-bold text-lg text-blue-400" }, `฿${p.price.toLocaleString()}`),
                    React.createElement("button", {
                      onClick: () => openProductDetails(p),
                      className: "bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-md shadow-blue-600/20"
                    }, t.detail)
                  )
                )
              )
            )
          )
        ),

        // 👤 Modal ล็อกอิน
        isLoginOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("form", { onSubmit: handleLogin, className: `max-w-xs w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("h2", { className: "text-lg font-bold mb-4" }, t.loginTitle),
            React.createElement("input", {
              type: "text",
              required: true,
              placeholder: t.usernamePlaceholder,
              value: usernameInput,
              onChange: (e) => setUsernameInput(e.target.value),
              className: "w-full p-2.5 border rounded-xl mb-4 bg-transparent text-sm focus:outline-none focus:border-blue-500"
            }),
            React.createElement("div", { className: "flex justify-end gap-2" },
              React.createElement("button", {
                type: "button",
                onClick: () => setIsLoginOpen(false),
                className: "px-3 py-1.5 border rounded-xl text-xs font-semibold"
              }, t.cancel),
              React.createElement("button", {
                type: "submit",
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold"
              }, t.login)
            )
          )
        ),

        // 📜 Modal ประวัติการซื้อ
        isHistoryOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `📜 ${t.history}`),
              React.createElement("button", { onClick: () => setIsHistoryOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3" },
              orderHistory.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noHistory)
              :
                orderHistory.map(order =>
                  React.createElement("div", { key: order.id, className: "p-3 border border-gray-500/20 rounded-xl bg-gray-500/5 text-xs" },
                    React.createElement("div", { className: "flex justify-between text-gray-400 mb-1" },
                      React.createElement("span", null, order.date),
                      React.createElement("span", { className: "font-bold text-orange-400" }, order.store)
                    ),
                    order.items.map((item, idx) =>
                      React.createElement("div", { key: idx, className: "flex justify-between py-1" },
                        React.createElement("span", null, item.name),
                        React.createElement("span", { className: "font-semibold" }, `฿${item.price.toLocaleString()}`)
                      )
                    ),
                    React.createElement("div", { className: "text-right font-bold text-blue-400 mt-2 pt-1 border-t border-gray-500/20" },
                      `${t.total}: ฿${order.total.toLocaleString()}`
                    )
                  )
                )
            )
          )
        ),

        // 👁️ Modal ประวัติการดูสินค้าล่าสุด
        isRecentOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[80vh] ${cardBgClass}` },
            React.createElement("div", { className: "flex justify-between items-center pb-3 border-b border-gray-500/30" },
              React.createElement("h2", { className: "text-lg font-bold" }, `👁️ ${t.recent}`),
              React.createElement("button", { onClick: () => setIsRecentOpen(false), className: "text-gray-400 hover:text-white" }, "✕")
            ),
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-2" },
              recentlyViewed.length === 0 ?
                React.createElement("p", { className: "text-center text-xs opacity-50 py-8" }, t.noRecent)
              :
                recentlyViewed.map(item =>
                  React.createElement("div", {
                    key: item.id,
                    onClick: () => {
                      setIsRecentOpen(false);
                      openProductDetails(item);
                    },
                    className: "flex items-center gap-3 p-2 border border-gray-500/20 rounded-xl bg-gray-500/5 hover:bg-gray-500/10 cursor-pointer transition-all"
                  },
                    React.createElement("img", { src: item.img, alt: item.name, className: "w-10 h-10 object-contain bg-white rounded p-1" }),
                    React.createElement("div", { className: "flex-grow min-w-0" },
                      React.createElement("p", { className: "font-bold text-xs truncate" }, item.name),
                      React.createElement("p", { className: "text-xs text-blue-400" }, `฿${item.price.toLocaleString()}`)
                    )
                  )
                )
            )
          )
        ),

        // Pop-up รายละเอียดสินค้า
        selectedProduct && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-md w-full rounded-2xl p-6 shadow-2xl border ${cardBgClass}` },
            React.createElement("div", { className: "bg-white p-4 rounded-xl mb-4 flex items-center justify-center h-48 shadow-inner" },
              React.createElement("img", { src: selectedProduct.img, alt: selectedProduct.name, className: "max-h-full max-w-full object-contain" })
            ),
            React.createElement("div", { className: "flex justify-between items-center mb-2" },
              React.createElement("span", { className: "text-xs border px-2 py-0.5 rounded font-mono font-bold" }, selectedProduct.type),
              React.createElement("span", { className: "text-xs bg-green-500/20 text-green-400 px-2.5 py-0.5 rounded-full font-bold" }, `${t.stock}: ${selectedProduct.stock}`)
            ),
            React.createElement("h2", { className: "text-xl font-bold mt-1" }, selectedProduct.name),
            React.createElement("p", { className: "text-sm font-semibold opacity-80 mt-1" }, selectedProduct.spec),
            React.createElement("p", { className: "text-xs opacity-70 mt-3 leading-relaxed border-t border-b border-gray-500/30 py-3" }, selectedProduct.desc),
            
            React.createElement("div", { className: "mt-3 p-2.5 bg-gray-500/10 rounded-xl flex justify-between items-center" },
              React.createElement("span", { className: "text-xs opacity-90 font-medium" }, `${t.goTo} ${selectedProduct.storeName}`),
              React.createElement("a", {
                href: selectedProduct.shopUrl,
                target: "_blank",
                rel: "noopener noreferrer",
                className: "text-xs bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-3 py-1.5 rounded-lg font-bold transition-all"
              }, `${t.goTo} ${selectedProduct.storeName} ↗`)
            ),

            React.createElement("div", { className: "flex justify-between items-center mt-5" },
              React.createElement("div", null,
                React.createElement("span", { className: "text-xs opacity-60 block" }, "ราคา"),
                React.createElement("span", { className: "text-2xl font-extrabold text-blue-400" }, `฿${selectedProduct.price.toLocaleString()}`)
              ),
              React.createElement("div", { className: "flex gap-2" },
                React.createElement("button", {
                  onClick: () => setSelectedProduct(null),
                  className: "px-4 py-2 border border-gray-500/50 rounded-xl text-xs font-semibold hover:bg-gray-500/20 active:scale-95 transition-all"
                }, t.cancel),
                React.createElement("button", {
                  onClick: () => {
                    addToCart(selectedProduct);
                    setSelectedProduct(null);
                  },
                  className: "px-4 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all"
                }, `+ ${t.addToCart}`)
              )
            )
          )
        ),

        // 🛒 หน้าต่างตะกร้าสินค้า
        isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" },
          React.createElement("div", { className: `max-w-lg w-full rounded-2xl p-6 shadow-2xl border flex flex-col max-h-[85vh] ${cardBgClass}` },
            
            // Cart Header
            React.createElement("div", { className: "flex justify-between items-center pb-4 border-b border-gray-500/30" },
              React.createElement("div", { className: "flex items-center gap-2" },
                React.createElement("span", { className: "text-xl" }, "🛒"),
                React.createElement("h2", { className: "text-lg font-bold" }, t.cart),
                React.createElement("span", { className: "text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-bold" }, `${cart.length}`)
              ),
              React.createElement("button", {
                onClick: () => setIsCartOpen(false),
                className: "text-gray-400 hover:text-white text-lg font-bold p-1 rounded-lg hover:bg-gray-500/20 transition-all"
              }, "✕")
            ),

            // Cart Items List
            React.createElement("div", { className: "flex-grow overflow-y-auto py-4 space-y-3 my-2 pr-1" },
              cart.length === 0 ? 
                React.createElement("div", { className: "text-center py-12 opacity-50" },
                  React.createElement("span", { className: "text-4xl block mb-2" }, "🛒"),
                  React.createElement("p", { className: "text-sm" }, "ยังไม่มีสินค้าในตะกร้า")
                )
              :
                cart.map(item =>
                  React.createElement("div", { key: item.cartItemId, className: "flex items-center justify-between p-3 border border-gray-500/20 rounded-xl bg-gray-500/5 hover:bg-gray-500/10 transition-all gap-3" },
                    React.createElement("div", { className: "w-14 h-14 bg-white rounded-lg p-1 flex-shrink-0 flex items-center justify-center border" },
                      React.createElement("img", { src: item.img, alt: item.name, className: "max-h-full max-w-full object-contain" })
                    ),
                    React.createElement("div", { className: "flex-grow min-w-0" },
                      React.createElement("h4", { className: "font-bold text-sm truncate" }, item.name),
                      React.createElement("p", { className: "text-xs opacity-70" }, item.spec),
                      React.createElement("span", { className: "text-xs font-bold text-blue-400 block mt-0.5" }, `฿${item.price.toLocaleString()}`)
                    ),
                    React.createElement("div", { className: "flex items-center gap-2 flex-shrink-0" },
                      React.createElement("button", {
                        onClick: () => checkoutStore(item.storeName, item.shopUrl),
                        className: "text-xs bg-orange-500 hover:bg-orange-600 text-white px-2.5 py-1.5 rounded-lg font-bold transition-all"
                      }, `${t.buy} (${item.storeName}) ↗`),
                      React.createElement("button", {
                        onClick: () => removeFromCart(item.cartItemId),
                        className: "text-xs bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white px-2 py-1.5 rounded-lg font-bold transition-all"
                      }, "❌")
                    )
                  )
                )
            ),

            // Cart Footer
            cart.length > 0 && React.createElement("div", { className: "pt-4 border-t border-gray-500/30" },
              React.createElement("div", { className: "flex justify-between items-center mb-3" },
                React.createElement("span", { className: "text-sm font-medium opacity-80" }, t.total),
                React.createElement("span", { className: "text-2xl font-black text-blue-400" }, `฿${totalPrice.toLocaleString()}`)
              ),
              
              React.createElement("div", { className: "flex flex-col gap-2" },
                React.createElement("div", { className: "grid grid-cols-2 gap-2" },
                  uniqueStores.map(store => 
                    React.createElement("button", {
                      key: store.name,
                      onClick: () => checkoutStore(store.name, store.url),
                      className: "py-2.5 px-3 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl active:scale-95 transition-all text-center shadow-md shadow-orange-500/20 flex items-center justify-center gap-1 truncate"
                    }, `🛍️ ${t.goTo} ${store.name}`)
                  )
                ),
                React.createElement("button", {
                  onClick: () => setCart([]),
                  className: "w-full py-1.5 border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded-xl text-xs font-semibold transition-all mt-1"
                }, t.clearCart)
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
