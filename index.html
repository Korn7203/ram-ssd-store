<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KORN RAM & SSD Store - Auth System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInSlide 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-900 text-white selection:bg-blue-500 selection:text-white min-h-screen">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";
    
    // นำเข้า Firebase SDK (v10+)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      sendEmailVerification, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚙️ **การตั้งค่า Firebase** (ให้นำคีย์จาก Firebase Console มาวางที่นี่)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const TEXTS = {
      TH: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "เข้าสู่ระบบ",
        register: "สมัครสมาชิก",
        logout: "ออกจากระบบ",
        email: "อีเมล",
        password: "รหัสผ่าน",
        confirmPassword: "ยืนยันรหัสผ่าน",
        verifyNotice: "กรุณาตรวจสอบอีเมลของคุณเพื่อยืนยันบัญชีก่อนใช้งาน",
        resendEmail: "ส่งอีเมลยืนยันอีกครั้ง",
        emailVerified: "ยืนยันอีเมลแล้ว",
        emailNotVerified: "ยังไม่ได้ยืนยันอีเมล",
        loginError: "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
        registerSuccess: "สมัครสมาชิกสำเร็จ! เราได้ส่งลิงก์ยืนยันไปยังอีเมลของคุณแล้ว",
        passwordMismatch: "รหัสผ่านไม่ตรงกัน",
        close: "ปิด",
        history: "ประวัติการซื้อ",
        recent: "ดูล่าสุด",
        cart: "ตะกร้า"
      },
      EN: {
        storeTitle: "KORN RAM & SSD STORE",
        login: "Login",
        register: "Register",
        logout: "Logout",
        email: "Email",
        password: "Password",
        confirmPassword: "Confirm Password",
        verifyNotice: "Please check your email to verify your account.",
        resendEmail: "Resend Verification Email",
        emailVerified: "Email Verified",
        emailNotVerified: "Email Not Verified",
        loginError: "Invalid email or password",
        registerSuccess: "Registration successful! Verification email sent.",
        passwordMismatch: "Passwords do not match",
        close: "Close",
        history: "Order History",
        recent: "Recently Viewed",
        cart: "Cart"
      }
    };

    function App() {
      const [lang, setLang] = useState("TH");
      const [user, setUser] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // "login" หรือ "register"

      // Form States
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [errorMessage, setErrorMessage] = useState("");
      const [successMessage, setSuccessMessage] = useState("");
      const [loading, setLoading] = useState(false);

      const t = TEXTS[lang];

      // ติดตามสถานะการเข้าสู่ระบบ
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
        });
        return () => unsubscribe();
      }, []);

      // จัดการเข้าสู่ระบบ
      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMessage("");
        setSuccessMessage("");
        setLoading(true);

        try {
          await signInWithEmailAndPassword(auth, email, password);
          setIsAuthOpen(false);
          resetForm();
        } catch (error) {
          if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
            setErrorMessage(t.loginError);
          } else {
            setErrorMessage(error.message);
          }
        } finally {
          setLoading(false);
        }
      };

      // จัดการสมัครสมาชิก + ส่งอีเมลยืนยัน
      const handleRegister = async (e) => {
        e.preventDefault();
        setErrorMessage("");
        setSuccessMessage("");

        if (password !== confirmPassword) {
          setErrorMessage(t.passwordMismatch);
          return;
        }

        if (password.length < 6) {
          setErrorMessage("รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร");
          return;
        }

        setLoading(true);

        try {
          // 1. สร้างบัญชีผู้ใช้
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          
          // 2. ส่งอีเมลยืนยันตัวตน
          await sendEmailVerification(userCredential.user);

          setSuccessMessage(t.registerSuccess);
          setTimeout(() => {
            setIsAuthOpen(false);
            resetForm();
          }, 3000);
        } catch (error) {
          if (error.code === 'auth/email-already-in-use') {
            setErrorMessage("อีเมลนี้ถูกใช้งานแล้วในระบบ");
          } else {
            setErrorMessage(error.message);
          }
        } finally {
          setLoading(false);
        }
      };

      // ส่งอีเมลยืนยันซ้ำ
      const handleResendVerification = async () => {
        if (auth.currentUser) {
          try {
            await sendEmailVerification(auth.currentUser);
            alert("ส่งอีเมลยืนยันอีกครั้งเรียบร้อยแล้ว!");
          } catch (err) {
            alert("เกิดข้อผิดพลาด: " + err.message);
          }
        }
      };

      const handleLogout = () => {
        signOut(auth);
      };

      const resetForm = () => {
        setEmail("");
        setPassword("");
        setConfirmPassword("");
        setErrorMessage("");
        setSuccessMessage("");
      };

      return React.createElement("div", { className: "p-4 max-w-5xl mx-auto" },
        // Header
        React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-gray-700" },
          React.createElement("h1", { className: "text-xl font-bold text-blue-400" }, t.storeTitle),
          
          React.createElement("div", { className: "flex items-center gap-3" },
            React.createElement("button", {
              onClick: () => setLang(lang === "TH" ? "EN" : "TH"),
              className: "px-2.5 py-1 border border-gray-700 rounded-lg text-xs hover:bg-gray-800"
            }, `🌐 ${lang}`),

            user ? 
              React.createElement("div", { className: "flex items-center gap-3" },
                React.createElement("div", { className: "text-right" },
                  React.createElement("div", { className: "text-xs font-bold text-green-400" }, user.email),
                  React.createElement("div", { className: `text-[10px] ${user.emailVerified ? "text-blue-400" : "text-yellow-400"}` },
                    user.emailVerified ? `✓ ${t.emailVerified}` : `⚠️ ${t.emailNotVerified}`
                  )
                ),
                React.createElement("button", {
                  onClick: handleLogout,
                  className: "px-3 py-1.5 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-bold hover:bg-red-600/40"
                }, t.logout)
              )
            :
              React.createElement("button", {
                onClick: () => { setAuthMode("login"); setIsAuthOpen(true); },
                className: "px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700"
              }, `👤 ${t.login}`)
          )
        ),

        // แถบแจ้งเตือนกรณียังไม่ได้ยืนยันอีเมล
        user && !user.emailVerified && React.createElement("div", { className: "mt-4 p-3 bg-yellow-500/10 border border-yellow-500/30 rounded-xl flex justify-between items-center text-xs text-yellow-300" },
          React.createElement("span", null, `⚠️ ${t.verifyNotice}`),
          React.createElement("button", {
            onClick: handleResendVerification,
            className: "px-3 py-1 bg-yellow-500 text-gray-900 font-bold rounded-lg hover:bg-yellow-400"
          }, t.resendEmail)
        ),

        // เนื้อหาหลัก
        React.createElement("main", { className: "mt-8 text-center py-16 text-gray-400 border border-dashed border-gray-800 rounded-2xl" },
          React.createElement("h2", { className: "text-lg font-bold text-white mb-2" }, "ยินดีต้อนรับสู่ KORN RAM & SSD Store"),
          React.createElement("p", { className: "text-sm" }, user ? `คุณเข้าสู่ระบบในชื่อ: ${user.email}` : "กรุณาเข้าสู่ระบบเพื่อใช้งานเต็มรูปแบบ")
        ),

        // Modal ล็อกอิน / สมัครสมาชิก
        isAuthOpen && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" },
          React.createElement("div", { className: "max-w-sm w-full bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-2xl relative" },
            
            // ปุ่มปิด
            React.createElement("button", {
              onClick: () => { setIsAuthOpen(false); resetForm(); },
              className: "absolute top-4 right-4 text-gray-400 hover:text-white"
            }, "✕"),

            // แท็บเลือก Login / Register
            React.createElement("div", { className: "flex border-b border-gray-700 mb-6" },
              React.createElement("button", {
                onClick: () => { setAuthMode("login"); resetForm(); },
                className: `flex-1 pb-3 text-sm font-bold ${authMode === "login" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-400"}`
              }, t.login),
              React.createElement("button", {
                onClick: () => { setAuthMode("register"); resetForm(); },
                className: `flex-1 pb-3 text-sm font-bold ${authMode === "register" ? "text-blue-400 border-b-2 border-blue-400" : "text-gray-400"}`
              }, t.register)
            ),

            // ข้อความแจ้งเตือนข้อผิดพลาด / สำเร็จ
            errorMessage && React.createElement("div", { className: "mb-4 p-2.5 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs" }, errorMessage),
            successMessage && React.createElement("div", { className: "mb-4 p-2.5 bg-green-500/10 border border-green-500/30 text-green-400 rounded-xl text-xs" }, successMessage),

            // ฟอร์ม
            React.createElement("form", { onSubmit: authMode === "login" ? handleLogin : handleRegister, className: "space-y-4" },
              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.email),
                React.createElement("input", {
                  type: "email",
                  required: true,
                  placeholder: "example@email.com",
                  value: email,
                  onChange: (e) => setEmail(e.target.value),
                  className: "w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white"
                })
              ),

              React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.password),
                React.createElement("input", {
                  type: "password",
                  required: true,
                  placeholder: "••••••••",
                  value: password,
                  onChange: (e) => setPassword(e.target.value),
                  className: "w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white"
                })
              ),

              authMode === "register" && React.createElement("div", null,
                React.createElement("label", { className: "block text-xs text-gray-400 mb-1" }, t.confirmPassword),
                React.createElement("input", {
                  type: "password",
                  required: true,
                  placeholder: "••••••••",
                  value: confirmPassword,
                  onChange: (e) => setConfirmPassword(e.target.value),
                  className: "w-full p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-white"
                })
              ),

              React.createElement("button", {
                type: "submit",
                disabled: loading,
                className: "w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition-all disabled:opacity-50 mt-2"
              }, loading ? "กำลังดำเนินการ..." : (authMode === "login" ? t.login : t.register))
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
